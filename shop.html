<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | WORKING REMOTELY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)), 
                        url('https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .blur-card { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px); 
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }
        body { opacity: 0; transition: opacity 0.5s; overflow-x: hidden; scroll-behavior: smooth; }
        #activity-ticker {
            position: fixed; bottom: 90px; left: 20px; z-index: 1000;
            pointer-events: none; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(100px); opacity: 0;
        }
        .ticker-visible { transform: translateY(0) !important; opacity: 1 !important; }
        #cart-sidebar { transition: transform 0.3s ease-in-out; z-index: 2000; }
    </style>
</head>
<body id="main-body" class="hero-bg min-h-screen text-gray-900 font-sans">

    <nav class="p-6 flex justify-between items-center max-w-7xl mx-auto relative z-10">
        <h1 class="text-2xl font-black text-white italic tracking-tighter uppercase">WORKING REMOTELY</h1>
        <div class="flex items-center space-x-6">
            <a href="#training-center" class="text-white text-[11px] font-black uppercase tracking-widest hover:text-blue-400">Training</a>
            
            <button onclick="toggleCart(true)" class="relative text-white group">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-blue-600 text-[10px] font-bold px-1.5 py-0.5 rounded-full text-white">0</span>
            </button>

            <a href="profile.html" class="text-white text-[11px] font-black uppercase tracking-widest">Profile</a>
            <button id="logout-btn" class="bg-red-600 text-white px-5 py-2 rounded-full text-[11px] font-black uppercase italic">Logout</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 pt-10">
            <p class="text-white col-span-full text-center animate-pulse uppercase font-black italic">Synchronizing Marketplace...</p>
        </div>

        <section id="training-center" class="mt-32">
            <h2 class="text-center text-white text-xl font-black uppercase italic tracking-[0.3em] mb-12">Training Center</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="blur-card p-8 rounded-[2.5rem] shadow-xl border-l-8 border-blue-600">
                    <h3 class="text-xl font-black text-blue-900 uppercase italic mb-2">Outlier Training</h3>
                    <button onclick="Tawk_API.maximize()" class="bg-black text-white w-full py-3 rounded-xl font-black text-[10px] uppercase mt-4">Enrol for Training</button>
                </div>
                <div class="blur-card p-8 rounded-[2.5rem] shadow-xl border-l-8 border-green-600">
                    <h3 class="text-xl font-black text-green-900 uppercase italic mb-2">Crowdgen Mastery</h3>
                    <button onclick="Tawk_API.maximize()" class="bg-black text-white w-full py-3 rounded-xl font-black text-[10px] uppercase mt-4">Enrol for Training</button>
                </div>
            </div>
        </section>
    </main>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-80 bg-white shadow-2xl transform translate-x-full p-6 flex flex-col">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-black uppercase italic text-blue-900">Your Basket</h2>
            <button onclick="toggleCart(false)" class="text-gray-400 hover:text-black text-2xl">✕</button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto space-y-4"></div>
        <div class="border-t pt-6 mt-6">
            <div id="discount-note" class="hidden mb-4 text-[10px] font-black text-green-600 uppercase bg-green-50 p-2 rounded-lg text-center italic">🎉 10% Multi-Buy Discount Applied!</div>
            <div class="flex justify-between font-black text-lg text-black uppercase mb-6">
                <span>Total</span><span id="cart-total">$0</span>
            </div>
            <button onclick="checkout('tawk')" class="w-full bg-blue-700 text-white py-4 rounded-xl font-black text-[10px] uppercase shadow-xl">Order via Live Chat</button>
            <p class="text-center text-[9px] font-bold text-gray-400 uppercase mt-4 italic">Customer support will process your order</p>
        </div>
    </div>

    <div id="activity-ticker">
        <div class="bg-white p-4 rounded-2xl border-l-4 border-blue-600 shadow-2xl flex items-center gap-4">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-ping"></div>
            <p id="ticker-text" class="text-[11px] font-black uppercase text-gray-800 italic"></p>
        </div>
    </div>

    <script type="text/javascript">
        var Tawk_API = Tawk_API || {};
        Tawk_API.id = '6797549464a0f82197e62180'; 
        Tawk_API.widgetId = '1jfp2cf6e';         
        (function(){
            var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
            s1.async=true; s1.src='https://embed.tawk.to/6797549464a0f82197e62180/1jfp2cf6e'; 
            s1.charset='UTF-8'; s1.setAttribute('crossorigin','*');
            s0.parentNode.insertBefore(s1,s0);
        })();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE", authDomain: "remoteworkingacess.firebaseapp.com", projectId: "remoteworkingacess", storageBucket: "remoteworkingacess.firebasestorage.app", messagingSenderId: "953179052891", appId: "1:953179052891:web:8126924e32e9fb62f4987e" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let cart = [];

        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = "index.html"; }
            else { document.getElementById('main-body').style.opacity = "1"; listenToProducts(); runLiveActivity(); }
        });

        function listenToProducts() {
            const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
            const grid = document.getElementById('product-grid');
            onSnapshot(q, (snapshot) => {
                grid.innerHTML = "";
                snapshot.forEach((doc) => {
                    const acc = doc.data();
                    const item = document.createElement('div');
                    item.className = "blur-card p-6 rounded-[2.5rem] shadow-xl flex flex-col justify-between";
                    item.innerHTML = `
                        <div>
                            <h3 class="text-lg font-black uppercase italic text-blue-900 tracking-tighter">${acc.name}</h3>
                            <p class="text-[10px] font-black text-blue-500 uppercase mt-1 mb-4 italic">Verified Account</p>
                            <p class="text-[11px] text-gray-600 font-bold mb-6">${acc.tasks || 'Immediate Access'}</p>
                        </div>
                        <div class="flex justify-between items-center pt-5 border-t border-gray-100">
                            <span class="text-2xl font-black text-black">$${acc.price}</span>
                            <button class="add-btn bg-blue-700 text-white px-5 py-2.5 rounded-xl font-black text-[10px] uppercase italic">Add to Cart</button>
                        </div>`;
                    
                    item.querySelector('.add-btn').onclick = () => {
                        cart.push({name: acc.name, price: acc.price});
                        updateCartUI();
                        toggleCart(true);
                    };
                    grid.appendChild(item);
                });
            });
        }

        window.toggleCart = (show) => {
            const sidebar = document.getElementById('cart-sidebar');
            show ? sidebar.classList.remove('translate-x-full') : sidebar.classList.add('translate-x-full');
        };

        window.updateCartUI = () => {
            document.getElementById('cart-count').innerText = cart.length;
            const itemsContainer = document.getElementById('cart-items');
            itemsContainer.innerHTML = cart.map((item, index) => `
                <div class="bg-gray-50 p-4 rounded-2xl flex justify-between items-center border border-gray-100">
                    <div>
                        <p class="text-[10px] font-black uppercase text-blue-900">${item.name}</p>
                        <p class="text-[10px] font-bold text-gray-500">$${item.price}</p>
                    </div>
                    <button onclick="removeFromCart(${index})" class="text-red-500 font-bold text-xs">✕</button>
                </div>
            `).join('');

            let total = cart.reduce((sum, item) => sum + Number(item.price), 0);
            if(cart.length >= 2) {
                total = total * 0.9;
                document.getElementById('discount-note').classList.remove('hidden');
            } else {
                document.getElementById('discount-note').classList.add('hidden');
            }
            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
        };

        window.removeFromCart = (index) => {
            cart.splice(index, 1);
            updateCartUI();
        };

        window.checkout = (method) => {
            if(cart.length === 0) return alert("Your basket is empty!");
            const items = cart.map(i => i.name).join(', ');
            const total = document.getElementById('cart-total').innerText;
            const message = `ORDER FROM WORKING REMOTELY: I want to buy [${items}] for ${total}. Please provide payment details.`;

            if (window.Tawk_API && typeof Tawk_API.maximize === 'function') {
                Tawk_API.maximize();
                Tawk_API.sendMessage(message);
                toggleCart(false);
            } else {
                alert("Connecting to Support... please wait.");
            }
        };

        function runLiveActivity() {
            const names = ["James K.", "Njeri M.", "Wambua D.", "Robert O.", "Mary S."];
            const deeds = ["purchased Outlier AI!", "requested training!", "withdrew $100.00!"];
            setInterval(() => {
                const text = document.getElementById('ticker-text');
                const ticker = document.getElementById('activity-ticker');
                if(text && ticker) {
                    text.innerText = `${names[Math.floor(Math.random()*names.length)]} ${deeds[Math.floor(Math.random()*deeds.length)]}`;
                    ticker.classList.add('ticker-visible');
                    setTimeout(() => ticker.classList.remove('ticker-visible'), 2500);
                }
            }, 6000);
        }

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "index.html");
    </script>
</body>
</html>
