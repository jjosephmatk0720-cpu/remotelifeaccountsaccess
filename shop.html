        body { background:#0f172a; font-family:sans-serif; color:white; overflow-x:hidden;}
        .glass-card { background:rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); backdrop-filter:blur(10px); transition: 0.3s ease;}
        .glass-card:hover { border-color: #3b82f6; }

        .prem-tag { background: linear-gradient(to right, #eab308, #ca8a04); color: black; font-size: 7px; font-weight: 900; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .free-tag { background: #22c55e; color: white; font-size: 7px; font-weight: 900; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
    </style>

let cart=[];
let allTraining = [];
let activePrice = 0;
let activeItemName = "";

// --- MARKET SYNC ---
onSnapshot(query(collection(db,"products"),orderBy("createdAt","desc")),(snap)=>{
    const list=document.getElementById('market-list');
    list.innerHTML="";
    snap.forEach(doc=>{
        const p=doc.data();
        const div=document.createElement('div');
        div.className="glass-card p-6 rounded-[2.5rem]";
        div.innerHTML=`<h2 class="text-lg font-black italic uppercase leading-tight">${p.name}</h2>
            <div class="flex justify-between items-center mt-6">
                <span class="text-2xl font-black">$${p.price}</span>
                <button onclick="addToCart('${p.name}',${p.price})" class="bg-blue-600 text-white px-6 py-2 rounded-full font-black uppercase text-[10px] italic">Add</button>
            </div>`;
        list.appendChild(div);
    });
});

// --- CART LOGIC ---
window.addToCart=(name,price)=>{ cart.push({name,price}); updateCartUI(); };
window.updateCartUI=()=>{
    const count = cart.length;
    document.getElementById('cart-count').innerText=count;
    if(count > 0){
        document.getElementById('cart-bar').classList.remove('hidden');
        let total = cart.reduce((s,i)=>s+i.price,0);
        if(count >= 2){ total *= 0.9; document.getElementById('promo-tag').classList.remove('hidden'); }
        else { document.getElementById('promo-tag').classList.add('hidden'); }
        activePrice = total.toFixed(2);
        activeItemName = cart.map(i => i.name).join(", ");
        document.getElementById('cart-summary').innerText=`${count} Selection(s)`;
        document.getElementById('cart-total').innerText=`$${activePrice}`;
    }
};

window.openPaymentFromCart = () => {
    document.getElementById('modal-sub-desc').innerText = `Checkout: $${activePrice}`;
    document.getElementById('payment-modal').classList.remove('hidden');
};

// --- TRAINING SYNC ---
onSnapshot(query(collection(db,"training_modules"),orderBy("createdAt","asc")),(snap)=>{
    allTraining = []; snap.forEach(doc => allTraining.push(doc.data()));
    filterTraining();
});

window.filterTraining = () => {
    const term = document.getElementById('trainingSearch').value.toLowerCase();
    const list = document.getElementById('training-list');
    list.innerHTML = "";
    if (term.length < 1) { list.innerHTML = "<p class='col-span-full text-center py-10 text-[9px] font-bold text-gray-600 uppercase italic'>Type to search...</p>"; return; }
    allTraining.forEach(t => {
        if (t.title.toLowerCase().includes(term)) {
            const isPremium = t.status === "premium"; 
            const div = document.createElement('div');
            div.className = `glass-card p-6 rounded-[2rem] border-l-4 ${isPremium ? 'border-yellow-500' : 'border-green-500'}`;
            div.innerHTML = `
                <div class="mb-2"><span class="${isPremium?'prem-tag':'free-tag'}">${isPremium?'PREMIUM':'FREE'}</span></div>
                <h2 class="text-sm font-black uppercase mb-4 leading-tight">${t.title}</h2>
                <button onclick="${isPremium ? `openPremiumSingle('${t.title}', 10)` : `window.open('${t.pdfUrl}')`}" 
                    class="w-full py-3 rounded-xl font-black uppercase text-[9px] italic ${isPremium ? 'bg-yellow-600 text-white' : 'border border-green-500 text-green-500'}">
                    ${isPremium ? 'Unlock' : 'Open'}
                </button>`;
            list.appendChild(div);
        }
    });
};

window.openPremiumSingle = (name, price) => {
    activeItemName = name; activePrice = price;
    document.getElementById('modal-sub-desc').innerText = `Pay $${activePrice} for ${activeItemName}`;
    document.getElementById('payment-modal').classList.remove('hidden');
};

// --- PAYMENT ACTIONS ---
window.triggerPesapal = async () => {
    const email = auth.currentUser?.email || "guest@jubileefortunes.com";
    const phone = prompt("Enter M-Pesa Number (254...):");
    if(!phone) return;
    await submitPaymentLog("M-Pesa STK");
    window.location.href = `https://www.pesapal.com/checkout/pay?guid=s3w7f0y67pRN3qlwRq0dRB3R1iFkfp8f&amt=${activePrice}&desc=${activeItemName}&email=${email}`;
};

async function submitPaymentLog(method) {
    if(!auth.currentUser) return;
    await addDoc(collection(db, "payment_submissions"), {
        userEmail: auth.currentUser.email, method: method, itemName: activeItemName,
        amount: activePrice, status: "pending", createdAt: serverTimestamp()
    });
}

window.confirmManualPayment = async () => {
    await submitPaymentLog("Manual/Crypto/Till");
    window.open(`https://wa.me/18088572943?text=I've paid $${activePrice} for ${activeItemName}.`,'_blank');
};

window.closePayment = () => document.getElementById('payment-modal').classList.add('hidden');
window.toggleCartDisplay = () => document.getElementById('cart-bar').classList.toggle('hidden');

let shuffledUsers = [...userPool].sort(() => Math.random() - 0.5);
let userIndex = 0;

function showActivity() {
    const ticker = document.getElementById('activity-ticker');
    const msg = document.getElementById('activity-msg');
    if (userIndex >= shuffledUsers.length) {
        shuffledUsers = [...userPool].sort(() => Math.random() - 0.5);

    }
    const currentUser = shuffledUsers[userIndex];
    const currentActivity = activityPool[Math.floor(Math.random() * activityPool.length)];
    msg.innerHTML = `<span class="text-blue-600">${currentUser}</span> ${currentActivity}`;

}
