<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | WORKING REMOTELY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background:#0f172a; font-family:sans-serif; color:white; overflow-x:hidden;}
        .glass-card { background:rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); backdrop-filter:blur(10px); transition: transform 0.3s ease;}
        .glass-card:hover { transform: translateY(-5px); border-color: #3b82f6; }
        .activity-popup {position:fixed; bottom:30px; left:20px; background:white; color:#0f172a; padding:12px 24px; border-radius:20px; font-weight:800; font-size:11px; display:none; z-index:1000; box-shadow:0 15px 40px rgba(0,0,0,0.6); border-left:5px solid #2563eb; animation:slideIn .5s ease-out;}
        @keyframes slideIn {from{transform:translateX(-100%); opacity:0;} to{transform:translateX(0); opacity:1;}}
        .section-title { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.2em; color: #64748b; margin-bottom: 20px; padding-left: 8px; border-left: 3px solid #3b82f6; }
        #cart-count {font-size:8px; position:absolute; top:-5px; right:-5px; background:red; color:white; border-radius:50%; width:14px; height:14px; display:flex; align-items:center; justify-content:center;}
    </style>
</head>

<body class="p-4 min-h-screen pb-32">

<div id="activity-ticker" class="activity-popup uppercase italic tracking-tighter">
    <span id="activity-msg">...</span>
</div>

<nav class="flex justify-between items-center mb-10 px-2">
    <h1 class="text-xl font-black italic tracking-tighter text-blue-500">WORKING REMOTELY</h1>
    <div class="flex items-center gap-3">
        <button onclick="toggleCartDisplay()" class="relative p-2 bg-gray-800 rounded-full border border-white/10">
            <i class="fas fa-shopping-cart text-white text-xs"></i>
            <span id="cart-count">0</span>
        </button>
        <a href="profile.html" class="text-[10px] font-black uppercase text-blue-400">Profile</a>
    </div>
</nav>

<div class="mb-12">
    <h3 class="section-title">Remote Work Packages</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="market-list"></div>
</div>

<div class="mb-12">
    <h3 class="section-title text-green-500 border-green-500">Training & Certification Hub</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="training-list"></div>
</div>

<div id="cart-bar" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[95%] max-w-md glass-card p-5 rounded-[2.5rem] flex flex-col gap-3 hidden z-50 shadow-2xl border-t-2 border-blue-500">
    <div class="flex justify-between items-center px-2">
        <div>
            <p id="promo-tag" class="text-[8px] font-black text-yellow-400 uppercase hidden">🔥 10% OFF APPLIED</p>
            <p id="cart-summary" class="font-black italic uppercase text-sm"></p>
        </div>
        <p id="cart-total" class="text-xl font-black text-white"></p>
    </div>
    <div class="flex gap-2">
        <button onclick="clearCart()" class="w-1/4 bg-red-600/20 text-red-500 py-4 rounded-2xl font-black uppercase text-[10px]">Clear</button>
        <button onclick="contactSupport()" class="w-3/4 bg-green-600 text-white py-4 rounded-2xl font-black uppercase text-xs italic tracking-widest shadow-lg">Order via WhatsApp</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig={
    apiKey:"AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE",
    authDomain:"remoteworkingacess.firebaseapp.com",
    projectId:"remoteworkingacess",
    storageBucket:"remoteworkingacess.firebasestorage.app",
    messagingSenderId:"953179052891",
    appId:"1:953179052891:web:8126924e32e9fb62f4987e"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
let cart=[];

// SYNC MARKETPLACE
onSnapshot(query(collection(db,"products"),orderBy("createdAt","desc")),(snap)=>{
    const list=document.getElementById('market-list'); list.innerHTML="";
    snap.forEach(doc=>{
        const p=doc.data();
        const card=document.createElement('div');
        card.className="glass-card p-6 rounded-[2rem]";
        card.innerHTML=`<p class="text-[10px] font-black text-blue-400 uppercase mb-1">Account Package</p>
            <h2 class="text-xl font-black italic uppercase mb-2">${p.name}</h2>
            <p class="text-gray-400 text-[11px] mb-6 font-medium">${p.tasks||'Verified Remote Access'}</p>
            <div class="flex justify-between items-center">
                <span class="text-2xl font-black">$${p.price}</span>
                <button onclick="addToCart('${p.name}',${p.price})" class="bg-blue-600 text-white px-5 py-2 rounded-full font-black uppercase text-[9px] italic">Add</button>
            </div>`;
        list.appendChild(card);
    });
});

// SYNC TRAINING (2 FREE, OTHERS PREMIUM)
onSnapshot(query(collection(db,"training_modules"),orderBy("createdAt","asc")),(snap)=>{
    const list=document.getElementById('training-list'); list.innerHTML="";
    let i=0;
    snap.forEach(doc=>{
        const t=doc.data(); i++;
        const isPrem = i > 2;
        const color = isPrem ? "yellow-500" : "green-500";
        const card=document.createElement('div');
        card.className=`glass-card p-6 rounded-[2rem] border-l-4 border-${color}`;
        card.innerHTML=`<div class="flex justify-between mb-4"><span class="text-[8px] font-black bg-${color} text-black px-2 py-0.5 rounded uppercase">${isPrem?'Premium':'Free'}</span></div>
            <h2 class="text-lg font-black italic uppercase mb-2">${t.title}</h2>
            <p class="text-gray-400 text-[10px] mb-6">${t.description||'Official Guide'}</p>
            ${isPrem ? `<button onclick="buyPrem('${t.title}')" class="w-full bg-yellow-600 text-white py-3 rounded-xl font-black uppercase text-[9px] italic shadow-lg">Unlock Certification ($10)</button>` : 
            `<a href="${t.pdfUrl}" target="_blank" class="block text-center border border-green-500 text-green-500 py-3 rounded-xl font-black uppercase text-[9px] italic">Download Free</a>`} `;
        list.appendChild(card);
    });
});

window.addToCart=(name,price)=>{cart.push({name,price}); updateCartUI();};
window.clearCart=()=>{cart=[]; updateCartUI(); document.getElementById('cart-bar').classList.add('hidden');};
window.updateCartUI=()=>{
    const count=cart.length; document.getElementById('cart-count').innerText=count;
    if(count>0){
        document.getElementById('cart-bar').classList.remove('hidden');
        let total=cart.reduce((s,i)=>s+i.price,0);
        if(count>=2){ total*=0.9; document.getElementById('promo-tag').classList.remove('hidden'); }
        document.getElementById('cart-summary').innerText=`${count} Package(s)`;
        document.getElementById('cart-total').innerText=`$${total.toFixed(2)}`;
    }
};

window.buyPrem=(title)=>{
    window.open(`https://wa.me/18608968455?text=I want to pay $10 for Premium Training and Certification: [${title}]`,'_blank');
};

window.contactSupport=()=>{
    const items=cart.map(i=>i.name).join(", ");
    window.open(`https://wa.me/18608968455?text=Order: ${items}`,'_blank');
};

window.toggleCartDisplay=()=>{document.getElementById('cart-bar').classList.toggle('hidden');};
</script>
</body>
</html>
