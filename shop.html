<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | Working Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .blur-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); }
        body { opacity: 0; transition: opacity 0.5s; }
        #cart-sidebar { transition: transform 0.3s ease-in-out; }
    </style>
</head>
<body id="main-body" class="hero-bg min-h-screen text-gray-900 font-sans">

    <nav class="p-6 flex justify-between items-center max-w-7xl mx-auto relative z-10">
        <h1 class="text-2xl font-black text-white italic tracking-tighter uppercase">Working Remote</h1>
        <div class="flex items-center space-x-6">
            <button onclick="toggleCart()" class="relative text-white group">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-blue-600 text-[10px] font-bold px-2 py-0.5 rounded-full">0</span>
            </button>
            <a href="profile.html" class="text-white text-xs font-bold uppercase tracking-widest hover:text-blue-400">Profile</a>
            <button onclick="logout()" class="bg-red-600 text-white px-5 py-2 rounded-full text-xs font-black uppercase italic hover:bg-black transition">Logout</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pt-10">
            </div>
    </main>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-80 bg-white shadow-2xl z-50 transform translate-x-full p-8 flex flex-col">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-black uppercase italic tracking-tighter">Your Order</h2>
            <button onclick="toggleCart()" class="text-gray-400 hover:text-black">✕</button>
        </div>
        
        <div id="cart-items" class="flex-grow overflow-y-auto space-y-4"></div>

        <div id="checkout-options" class="hidden border-t pt-6 mt-6 space-y-3">
            <p class="text-[10px] font-black uppercase text-gray-400 text-center mb-2">Select Transfer Method</p>
            <button onclick="processOrder('whatsapp')" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black text-xs uppercase italic tracking-widest hover:bg-black transition">
                Order via WhatsApp
            </button>
            <button onclick="processOrder('tawk')" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-xs uppercase italic tracking-widest hover:bg-black transition">
                Chat with Live Agent
            </button>
            <button onclick="resetCheckout()" class="w-full text-[9px] font-bold text-gray-400 uppercase pt-2">Back to Summary</button>
        </div>

        <div id="cart-footer" class="border-t pt-6 mt-6">
            <div id="discount-tag" class="hidden bg-green-100 text-green-700 text-[10px] font-black uppercase p-2 rounded-lg text-center mb-4 italic tracking-widest">
                🎉 10% Bundle Discount Applied!
            </div>
            <div class="flex justify-between font-bold mb-1 uppercase text-xs text-gray-400">
                <span>Subtotal</span>
                <span id="cart-subtotal">$0</span>
            </div>
            <div class="flex justify-between font-black mb-4 uppercase text-lg text-blue-900">
                <span>Total</span>
                <span id="cart-total">$0</span>
            </div>
            <button id="initial-btn" onclick="showOptions()" class="w-full bg-black text-white py-4 rounded-2xl font-black text-xs uppercase italic tracking-widest hover:bg-blue-700 transition">
                Proceed to Checkout
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE",
            authDomain: "remoteworkingacess.firebaseapp.com",
            projectId: "remoteworkingacess",
            storageBucket: "remoteworkingacess.firebasestorage.app",
            messagingSenderId: "953179052891",
            appId: "1:953179052891:web:8126924e32e9fb62f4987e"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let cart = [];

        onAuthStateChanged(auth, (user) => {
            if (!user || !user.emailVerified) { window.location.href = "index.html"; }
            else { document.getElementById('main-body').style.opacity = "1"; loadProducts(); }
        });

        async function loadProducts() {
            const grid = document.getElementById('product-grid');
            const querySnapshot = await getDocs(collection(db, "products"));
            grid.innerHTML = "";
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                grid.innerHTML += `
                    <div class="blur-card p-8 rounded-[2.5rem] shadow-2xl border border-white/50">
                        <h3 class="text-2xl font-black uppercase italic tracking-tighter mb-1 text-blue-900">${data.name}</h3>
                        <p class="text-gray-500 text-[11px] font-bold uppercase tracking-wider mb-6">${data.description}</p>
                        <div class="flex justify-between items-center pt-5 border-t border-gray-100">
                            <span class="text-3xl font-black text-black">$${data.price}</span>
                            <button onclick="addToCart('${doc.id}', '${data.name}', ${data.price})" class="bg-blue-700 text-white px-6 py-3 rounded-xl font-black text-[10px] uppercase italic hover:bg-black transition">Buy Now</button>
                        </div>
                    </div>`;
            });
        }

        window.addToCart = (id, name, price) => { cart.push({id, name, price}); updateCartUI(); toggleCart(true); };
        window.removeFromCart = (index) => { cart.splice(index, 1); updateCartUI(); if(cart.length === 0) resetCheckout(); };
        window.toggleCart = (forceOpen = false) => {
            const sidebar = document.getElementById('cart-sidebar');
            if (forceOpen) sidebar.classList.remove('translate-x-full');
            else sidebar.classList.toggle('translate-x-full');
        };

        window.updateCartUI = () => {
            const container = document.getElementById('cart-items');
            const subtotalEl = document.getElementById('cart-subtotal');
            const totalEl = document.getElementById('cart-total');
            const discountTag = document.getElementById('discount-tag');
            
            document.getElementById('cart-count').innerText = cart.length;
            container.innerHTML = cart.map((item, index) => `
                <div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl border border-gray-100">
                    <div><p class="font-black text-[10px] uppercase text-blue-900">${item.name}</p><p class="font-black text-sm">$${item.price}</p></div>
                    <button onclick="removeFromCart(${index})" class="text-red-500 font-bold text-[9px] uppercase">Remove</button>
                </div>`).join('');
            
            const subtotal = cart.reduce((acc, curr) => acc + Number(curr.price), 0);
            
            // 💰 DISCOUNT ALGORITHM: If items >= 2, apply 10% off
            let finalTotal = subtotal;
            if (cart.length >= 2) {
                finalTotal = subtotal * 0.90;
                discountTag.classList.remove('hidden');
            } else {
                discountTag.classList.add('hidden');
            }

            subtotalEl.innerText = `$${subtotal}`;
            totalEl.innerText = `$${finalTotal.toFixed(2)}`;
        };

        window.showOptions = () => {
            if (cart.length === 0) return alert("Cart is empty!");
            document.getElementById('checkout-options').classList.remove('hidden');
            document.getElementById('cart-footer').classList.add('hidden');
        };

        window.resetCheckout = () => {
            document.getElementById('checkout-options').classList.add('hidden');
            document.getElementById('cart-footer').classList.remove('hidden');
        };

        window.processOrder = (method) => {
            const items = cart.map(i => `${i.name} ($${i.price})`).join(', ');
            const finalPrice = document.getElementById('cart-total').innerText;
            const message = `ORDER REQUEST: ${items}. TOTAL PRICE: ${finalPrice}. USER: ${auth.currentUser.email}`;

            if (method === 'whatsapp') {
                window.open(`https://wa.me/18608968455?text=${encodeURIComponent(message)}`, '_blank');
            } else {
                window.open('https://tawk.to/chat/697549464a0f82197e621807/1jfp2cf6e', '_blank');
            }
        };

        window.logout = () => signOut(auth).then(() => window.location.href = "index.html");
    </script>
</body>
</html>
