<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Working Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .admin-bg { background: #0f172a; color: white; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        body { opacity: 0; transition: opacity 0.5s; }
        input, textarea { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; }
    </style>
</head>
<body id="main-body" class="admin-bg min-h-screen font-sans p-6">

    <nav class="max-w-7xl mx-auto flex justify-between items-center mb-10">
        <h1 class="text-2xl font-black italic uppercase tracking-tighter">Admin <span class="text-blue-500">Panel</span></h1>
        <div class="flex space-x-4">
            <a href="shop.html" class="text-[10px] font-black uppercase tracking-widest py-2 px-4 border border-white/20 rounded-full hover:bg-white hover:text-black transition">View Shop</a>
            <button onclick="logout()" class="text-[10px] font-black uppercase tracking-widest py-2 px-4 bg-red-600 rounded-full">Logout</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1 space-y-6">
            <div class="glass-panel p-6 rounded-[2rem] border-yellow-500/30">
                <h2 class="text-sm font-black uppercase tracking-widest text-yellow-400 mb-4 italic">📣 Flash Sale Banner</h2>
                <input type="text" id="announcement-msg" placeholder="e.g. 20% OFF TODAY!" class="w-full p-3 rounded-xl text-xs font-bold outline-none mb-3">
                <button onclick="postAnnouncement()" class="w-full bg-yellow-500 text-black font-black uppercase italic py-3 rounded-xl text-[10px] tracking-widest transition">Update Shop Banner</button>
            </div>

            <div class="glass-panel p-6 rounded-[2rem]">
                <h2 class="text-sm font-black uppercase tracking-widest text-blue-400 mb-6 italic">🏆 Top Recruiters</h2>
                <div id="leaderboard" class="space-y-4 text-[10px]"></div>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-6">
            <div class="glass-panel p-8 rounded-[2rem] border-purple-500/30">
                <h2 class="text-sm font-black uppercase tracking-widest text-purple-400 mb-6 italic">💸 Pending Withdrawals</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-[9px] font-black uppercase text-gray-500 border-b border-white/10">
                                <th class="pb-4 px-2">User & Wallet</th>
                                <th class="pb-4 px-2">Amount</th>
                                <th class="pb-4 px-2 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="withdrawal-list" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </div>

            <div class="glass-panel p-8 rounded-[2rem]">
                <h2 class="text-sm font-black uppercase tracking-widest text-blue-400 mb-6 italic">➕ List New Account</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="p-name" placeholder="Account Name" class="p-3 rounded-xl text-xs font-bold outline-none">
                    <input type="number" id="p-price" placeholder="Price (USD)" class="p-3 rounded-xl text-xs font-bold outline-none">
                    <input type="text" id="p-desc" placeholder="Region (UK/US)" class="p-3 rounded-xl text-xs font-bold outline-none">
                    <input type="text" id="p-tasks" placeholder="Tasks (AI TRAINING)" class="p-3 rounded-xl text-xs font-bold outline-none">
                    <textarea id="p-details" placeholder="Details..." class="md:col-span-2 p-3 rounded-xl text-xs font-bold h-20 outline-none"></textarea>
                    <button onclick="addProduct()" class="md:col-span-2 bg-blue-600 text-white font-black uppercase italic py-3 rounded-xl text-[10px] tracking-widest transition">Post to Marketplace</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, addDoc, setDoc, query, where, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE", authDomain: "remoteworkingacess.firebaseapp.com", projectId: "remoteworkingacess", storageBucket: "remoteworkingacess.firebasestorage.app", messagingSenderId: "953179052891", appId: "1:953179052891:web:8126924e32e9fb62f4987e" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const ADMIN_KEY = "SRC3838";

        onAuthStateChanged(auth, (user) => {
            if (!user) { 
                window.location.href = "index.html"; 
            } else {
                const access = prompt("ENTER ADMIN ACCESS KEY:");
                if (access === ADMIN_KEY) { 
                    document.getElementById('main-body').style.opacity = "1"; 
                    loadLeaderboard(); 
                    loadWithdrawals(); 
                } else {
                    alert("Unauthorized!");
                    window.location.href = "shop.html"; 
                }
            }
        });

        window.postAnnouncement = async () => {
            const msg = document.getElementById('announcement-msg').value;
            try {
                await setDoc(doc(db, "settings", "announcement"), { text: msg, active: msg !== "" });
                alert("Shop Banner Updated!");
            } catch (e) { alert(e.message); }
        };

        window.loadWithdrawals = async () => {
            const list = document.getElementById('withdrawal-list');
            const q = query(collection(db, "withdrawals"), where("status", "==", "pending"));
            const snap = await getDocs(q);
            list.innerHTML = "";
            if(snap.empty) list.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-gray-500 text-[10px]">No pending withdrawals.</td></tr>`;
            snap.forEach((d) => {
                const data = d.data();
                list.innerHTML += `
                <tr class="text-[10px] font-bold">
                    <td class="py-4 px-2">${data.email}<br><span class="text-blue-400 select-all font-mono">${data.wallet}</span></td>
                    <td class="py-4 px-2 text-green-400 font-black">${data.amount}</td>
                    <td class="py-4 px-2 text-right space-x-1">
                        <button onclick="handleWithdrawal('${d.id}', 'approved')" class="bg-green-600 px-2 py-1 rounded text-[8px] uppercase">Approve</button>
                        <button onclick="handleWithdrawal('${d.id}', 'declined')" class="bg-red-600 px-2 py-1 rounded text-[8px] uppercase">Decline</button>
                    </td>
                </tr>`;
            });
        };

        window.handleWithdrawal = async (id, status) => {
            if(confirm(`Mark request as ${status}?`)) {
                try {
                    const docRef = doc(db, "withdrawals", id);
                    await updateDoc(docRef, { status: status });
                    alert("Success!");
                    window.loadWithdrawals();
                } catch (e) { alert(e.message); }
            }
        };

        window.addProduct = async () => {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            if(!name || !price) return alert("Fill Name/Price");
            await addDoc(collection(db, "products"), { 
                name, 
                price, 
                description: document.getElementById('p-desc').value, 
                tasks: document.getElementById('p-tasks').value, 
                details: document.getElementById('p-details').value, 
                createdAt: new Date() 
            });
            alert("Product Added!");
        };

        async function loadLeaderboard() {
            const snap = await getDocs(collection(db, "users"));
            const counts = {};
            snap.forEach(d => { 
                const ref = d.data().referredBy;
                if(ref && ref !== "none") counts[ref] = (counts[ref] || 0) + 1; 
            });
            const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
            document.getElementById('leaderboard').innerHTML = sorted.map(([id, c]) => `
                <div class="flex justify-between p-3 bg-white/5 rounded-xl">
                    <span class="text-gray-400">ID: ...${id.slice(-6)}</span>
                    <span class="text-blue-400 font-black">${c} RECRUITS</span>
                </div>`).join('');
        }

        window.logout = () => signOut(auth).then(() => window.location.href = "index.html");
    </script>
</body>
</html>
