<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | WORKING REMOTELY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; font-family: sans-serif; color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-2xl font-black italic uppercase tracking-tighter text-blue-500">Working Remotely Admin</h1>
            <a href="shop.html" class="text-xs font-bold uppercase bg-white text-black px-4 py-2 rounded-full">View Shop</a>
        </div>

        <div class="glass-card p-8 rounded-[2.5rem] mb-10">
            <h2 class="text-lg font-black uppercase mb-6 italic">Add New Remote Package</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="p-name" placeholder="Package Name (e.g. Data Entry)" class="p-4 bg-gray-800 rounded-2xl outline-none text-sm font-bold">
                <input type="number" id="p-price" placeholder="Price (USD)" class="p-4 bg-gray-800 rounded-2xl outline-none text-sm font-bold">
                <textarea id="p-tasks" placeholder="Task Details/Description" class="p-4 bg-gray-800 rounded-2xl outline-none text-sm font-bold md:col-span-2 h-24"></textarea>
                
                <input type="password" id="admin-key" placeholder="Enter Admin Key (SRC3838)" class="p-4 bg-blue-900/30 border border-blue-500/30 rounded-2xl outline-none text-sm font-bold md:col-span-2">
                
                <button onclick="addProduct()" class="md:col-span-2 bg-blue-600 p-4 rounded-2xl font-black uppercase italic tracking-widest">Publish Package</button>
            </div>
        </div>

        <div class="glass-card p-8 rounded-[2.5rem]">
            <h2 class="text-lg font-black uppercase mb-6 italic text-gray-400">Current Listings</h2>
            <div id="admin-list" class="space-y-4">
                </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE", authDomain: "remoteworkingacess.firebaseapp.com", projectId: "remoteworkingacess", storageBucket: "remoteworkingacess.firebasestorage.app", messagingSenderId: "953179052891", appId: "1:953179052891:web:8126924e32e9fb62f4987e" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // SECURITY: ONLY ALLOW YOUR SPECIFIC ADMIN EMAIL
        onAuthStateChanged(auth, (user) => {
            if (!user || user.email !== "jubileefortunesinvestments@gmail.com") {
                alert("Unauthorized Access!");
                window.location.href = "index.html";
            }
        });

        // ADD PRODUCT LOGIC
        window.addProduct = async () => {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const tasks = document.getElementById('p-tasks').value;
            const key = document.getElementById('admin-key').value;

            // VERIFY ADMIN KEY
            if (key !== "SRC3838") {
                return alert("INVALID ADMIN KEY! ACTION DENIED.");
            }

            if (!name || !price) return alert("Fill Name and Price");

            try {
                await addDoc(collection(db, "products"), {
                    name,
                    price: parseFloat(price),
                    tasks,
                    createdAt: serverTimestamp()
                });
                alert("Package Published Successfully!");
                document.getElementById('p-name').value = "";
                document.getElementById('p-price').value = "";
                document.getElementById('p-tasks').value = "";
                document.getElementById('admin-key').value = "";
            } catch (e) { alert(e.message); }
        };

        // VIEW & DELETE LOGIC
        onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), (snapshot) => {
            const list = document.getElementById('admin-list');
            list.innerHTML = "";
            snapshot.forEach(docSnap => {
                const p = docSnap.data();
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-white/5 p-4 rounded-2xl";
                item.innerHTML = `
                    <div>
                        <p class="font-black italic uppercase text-sm">${p.name}</p>
                        <p class="text-xs text-blue-400 font-bold">$${p.price}</p>
                    </div>
                    <button onclick="deleteProduct('${docSnap.id}')" class="text-[10px] font-black uppercase text-red-500 bg-red-500/10 px-4 py-2 rounded-xl">Delete</button>
                `;
                list.appendChild(item);
            });
        });

        window.deleteProduct = async (id) => {
            const key = prompt("Confirm Admin Key to Delete:");
            if (key === "SRC3838") {
                await deleteDoc(doc(db, "products", id));
            } else {
                alert("Incorrect Key!");
            }
        };
    </script>
</body>
</html>
