<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | WORKING REMOTELY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        (function() {
            const accessKey = prompt("RESTRICTED ACCESS: Enter Admin Key to continue:");
            if (accessKey !== "SRC3838") {
                alert("ACCESS DENIED");
                window.location.href = "index.html";
            }
        })();
    </script>

    <style>
        body { background: #0f172a; font-family: sans-serif; color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        input, textarea { transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.05) !important; }
        input:focus, textarea:focus { border-color: #3b82f6 !important; background: rgba(30, 41, 59, 1) !important; outline: none; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-2xl font-black italic uppercase tracking-tighter text-blue-500">WORKING REMOTELY Admin</h1>
            <a href="index.html" class="text-xs font-bold uppercase bg-white text-black px-4 py-2 rounded-full hover:bg-blue-500 hover:text-white transition">Exit Panel</a>
        </div>

        <div class="glass-card p-8 rounded-[2.5rem] mb-10 border-l-4 border-yellow-500 shadow-2xl">
            <h2 class="text-lg font-black uppercase mb-2 italic text-yellow-500">Bulk Email Broadcast</h2>
            <p class="text-[10px] text-gray-400 mb-6 uppercase font-bold tracking-widest">Sending via contactsuportremoteworkings@gmail.com</p>
            
            <div class="space-y-4">
                <input type="text" id="email-subject" placeholder="Promotion Subject" class="w-full p-4 bg-gray-800 rounded-2xl text-sm font-bold">
                <textarea id="broadcast-msg" placeholder="Type your promotion message here..." class="w-full p-4 bg-gray-800 rounded-2xl text-sm font-bold h-32"></textarea>
                <button onclick="sendBroadcast()" id="broadcast-btn" class="w-full bg-yellow-500 text-black py-4 rounded-2xl font-black uppercase italic tracking-widest shadow-lg hover:bg-yellow-400 transition">Send To All Workers</button>
                <p id="broadcast-status" class="text-[10px] font-black uppercase text-center mt-2"></p>
            </div>
        </div>

        <div class="glass-card p-8 rounded-[2.5rem] mb-10 border-l-4 border-blue-500 shadow-2xl">
            <h2 class="text-lg font-black uppercase mb-6 italic text-blue-500">Manage Marketplace</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="p-name" placeholder="Package Name" class="p-4 bg-gray-800 rounded-2xl text-sm font-bold">
                <input type="number" id="p-price" placeholder="Price (USD)" class="p-4 bg-gray-800 rounded-2xl text-sm font-bold">
                <textarea id="p-tasks" placeholder="Package Description" class="p-4 bg-gray-800 rounded-2xl text-sm font-bold md:col-span-2 h-24"></textarea>
                <button onclick="addProduct()" class="md:col-span-2 bg-blue-600 p-4 rounded-2xl font-black uppercase italic tracking-widest hover:bg-blue-500 transition shadow-xl">Add Package</button>
            </div>
        </div>

        <div class="glass-card p-8 rounded-[2.5rem] shadow-2xl">
            <h2 class="text-lg font-black uppercase mb-6 italic text-gray-500">Live Items</h2>
            <div id="admin-list" class="space-y-3"></div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE", 
            authDomain: "remoteworkingacess.firebaseapp.com", 
            projectId: "remoteworkingacess", 
            storageBucket: "remoteworkingacess.firebasestorage.app", 
            messagingSenderId: "953179052891", 
            appId: "1:953179052891:web:8126924e32e9fb62f4987e" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- EMAILJS INITIALIZATION ---
        emailjs.init("bknDLORLRGE4fjaQU"); 

        const delay = ms => new Promise(res => setTimeout(res, ms));

        window.sendBroadcast = async () => {
            const subject = document.getElementById('email-subject').value;
            const message = document.getElementById('broadcast-msg').value;
            const btn = document.getElementById('broadcast-btn');
            const status = document.getElementById('broadcast-status');

            if (!subject || !message) return alert("Please fill the subject and message.");

            btn.disabled = true;
            btn.innerText = "PROCESSING...";
            status.innerText = "Checking customer list...";
            status.className = "text-blue-400 uppercase text-[10px] font-black text-center mt-2";

            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                let sentCount = 0;
                let skipCount = 0;
                
                for (const userDoc of querySnapshot.docs) {
                    let email = userDoc.data().email;
                    
                    if (email) {
                        // 1. Clean data: Remove spaces and make lowercase
                        email = email.trim().toLowerCase();

                        // 2. Validate: Skip emails with typos like '.come' or missing '@'
                        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,4}$/;
                        if (!emailRegex.test(email)) {
                            console.warn("Skipping bad email address:", email);
                            skipCount++;
                            continue; 
                        }

                        status.innerText = `Sending to: ${email}...`;
                        
                        try {
                            // 3. Send to EmailJS - Make sure {{user_email}} is in your template!
                            await emailjs.send("service_8l6ng22", "template_n1t3m08", {
                                subject: subject,
                                message: message,
                                user_email: email, 
                                admin_email: "contactsuportremoteworkings@gmail.com"
                            });
                            
                            sentCount++;
                            // 4. Safety delay to prevent blocking
                            await delay(1500); 
                        } catch (sendErr) {
                            console.error("EmailJS rejection for:", email, sendErr);
                        }
                    }
                }
                status.innerText = `SUCCESS: SENT TO ${sentCount} (SKIPPED ${skipCount} BAD EMAILS)`;
                status.className = "text-green-400 uppercase text-[10px] font-black text-center mt-2";
                alert("Broadcast Complete!");
            } catch (err) {
                console.error("Database Error:", err);
                status.innerText = "FAILED: DATABASE ERROR";
                status.className = "text-red-500 uppercase text-[10px] font-black text-center mt-2";
            } finally {
                btn.disabled = false;
                btn.innerText = "Send To All Workers";
            }
        };

        // --- MARKETPLACE LOGIC ---
        window.addProduct = async () => {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const tasks = document.getElementById('p-tasks').value;

            if (!name || !price) return alert("Fill out the package name and price.");

            try {
                await addDoc(collection(db, "products"), {
                    name,
                    price: parseFloat(price),
                    tasks,
                    createdAt: serverTimestamp()
                });
                alert("Package Published!");
                document.getElementById('p-name').value = "";
                document.getElementById('p-price').value = "";
                document.getElementById('p-tasks').value = "";
            } catch (e) { alert("Firebase Error: " + e.message); }
        };

        onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), (snapshot) => {
            const list = document.getElementById('admin-list');
            list.innerHTML = "";
            snapshot.forEach(docSnap => {
                const p = docSnap.data();
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-white/5 p-4 rounded-2xl border border-white/5";
                item.innerHTML = `
                    <div>
                        <p class="font-black italic uppercase text-sm">${p.name}</p>
                        <p class="text-[10px] text-blue-400 font-bold">$${p.price}</p>
                    </div>
                    <button onclick="deleteProduct('${docSnap.id}')" class="text-[9px] font-black uppercase text-red-500 bg-red-500/10 px-4 py-2 rounded-xl hover:bg-red-500 hover:text-white transition">Delete</button>
                `;
                list.appendChild(item);
            });
        });

        window.deleteProduct = async (id) => {
            if (confirm("Delete this package?")) {
                await deleteDoc(doc(db, "products", id));
            }
        };
    <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200 mt-10">
    <h2 class="text-2xl font-black text-slate-800 mb-6">Upload New Training Module</h2>
    
    <div class="space-y-4">
        <input type="text" id="pdfTitle" placeholder="Module Title (e.g., Advanced Data Entry)" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500">
        <textarea id="pdfDesc" placeholder="Brief Description..." class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500"></textarea>
        
        <div class="flex items-center justify-center w-full">
            <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-300 border-dashed rounded-xl cursor-pointer bg-slate-50 hover:bg-slate-100">
                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <i class="fas fa-cloud-upload-alt text-2xl text-slate-400 mb-2"></i>
                    <p class="text-sm text-slate-500 font-bold">Click to select PDF</p>
                </div>
                <input id="pdfFile" type="file" class="hidden" accept="application/pdf" />
            </label>
        </div>

        <button id="uploadBtn" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase tracking-widest text-xs hover:bg-blue-700 transition-all">
            Publish Training Now
        </button>
        <p id="uploadStatus" class="text-center text-xs font-bold text-blue-600 hidden">Uploading... please wait.</p>
    </div>
</div>

<script type="module">
    import { auth, db } from "./firebase-config.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
    import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const storage = getStorage();

    document.getElementById('uploadBtn').addEventListener('click', async () => {
        const file = document.getElementById('pdfFile').files[0];
        const title = document.getElementById('pdfTitle').value;
        const desc = document.getElementById('pdfDesc').value;
        const status = document.getElementById('uploadStatus');

        if(!file || !title) return alert("Please provide a title and select a file.");

        status.classList.remove('hidden');
        
        try {
            // 1. Upload to Storage
            const storageRef = ref(storage, 'training/' + file.name);
            await uploadBytes(storageRef, file);
            const downloadURL = await getDownloadURL(storageRef);

            // 2. Save Link to Firestore
            await addDoc(collection(db, "training_modules"), {
                title: title,
                description: desc,
                pdfUrl: downloadURL,
                createdAt: serverTimestamp()
            });

            alert("Training Module Published Successfully!");
            location.reload();
        } catch (error) {
            console.error(error);
            alert("Upload failed. Check Firebase Storage rules.");
        }
    });
</script>
</body>
</html>
