<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | WORKING REMOTELY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        (function() {
            const accessKey = prompt("RESTRICTED ACCESS: Enter Admin Key (SRC3838) to continue:");
            if (accessKey !== "SRC3838") {
                alert("ACCESS DENIED");
                window.location.href = "index.html";
            }
        })();
    </script>

    <style>
        body { background: #0f172a; font-family: sans-serif; color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        input, textarea { transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.05) !important; }
        input:focus, textarea:focus { border-color: #3b82f6 !important; background: rgba(30, 41, 59, 1) !important; outline: none; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-2xl font-black italic uppercase tracking-tighter text-blue-500">Working Remotely Admin</h1>
            <a href="shop.html" class="text-xs font-bold uppercase bg-white text-black px-4 py-2 rounded-full hover:bg-blue-500 hover:text-white transition">View Shop</a>
        </div>

        <div class="glass-card p-8 rounded-[2.5rem] mb-10 border-l-4 border-yellow-500 shadow-2xl">
            <h2 class="text-lg font-black uppercase mb-2 italic text-yellow-500">Bulk Email Broadcast</h2>
            <p class="text-[10px] text-gray-400 mb-6 uppercase font-bold tracking-widest">Send updates via contactsuportremoteworkings@gmail.com</p>
            
            <div class="space-y-4">
                <input type="text" id="email-subject" placeholder="Email Subject" class="w-full p-4 bg-gray-800 rounded-2xl text-sm font-bold">
                <textarea id="broadcast-msg" placeholder="Your announcement message..." class="w-full p-4 bg-gray-800 rounded-2xl text-sm font-bold h-32"></textarea>
                <button onclick="sendBroadcast()" id="broadcast-btn" class="w-full bg-yellow-500 text-black py-4 rounded-2xl font-black uppercase italic tracking-widest shadow-lg hover:bg-yellow-400 transition">Send To All Workers</button>
                <p id="broadcast-status" class="text-[10px] font-black uppercase text-center mt-2"></p>
            </div>
        </div>

        <div class="glass-card p-8 rounded-[2.5rem] mb-10 border-l-4 border-blue-500 shadow-2xl">
            <h2 class="text-lg font-black uppercase mb-6 italic text-blue-500">Add New Package</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="p-name" placeholder="Package Name" class="p-4 bg-gray-800 rounded-2xl text-sm font-bold">
                <input type="number" id="p-price" placeholder="Price (USD)" class="p-4 bg-gray-800 rounded-2xl text-sm font-bold">
                <textarea id="p-tasks" placeholder="Package Description/Tasks" class="p-4 bg-gray-800 rounded-2xl text-sm font-bold md:col-span-2 h-24"></textarea>
                <button onclick="addProduct()" class="md:col-span-2 bg-blue-600 p-4 rounded-2xl font-black uppercase italic tracking-widest hover:bg-blue-500 transition shadow-xl">Publish Package</button>
            </div>
        </div>

        <div class="glass-card p-8 rounded-[2.5rem] shadow-2xl">
            <h2 class="text-lg font-black uppercase mb-6 italic text-gray-500">Live Marketplace</h2>
            <div id="admin-list" class="space-y-3"></div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE", 
            authDomain: "remoteworkingacess.firebaseapp.com", 
            projectId: "remoteworkingacess", 
            storageBucket: "remoteworkingacess.firebasestorage.app", 
            messagingSenderId: "953179052891", 
            appId: "1:953179052891:web:8126924e32e9fb62f4987e" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- EMAILJS CONFIGURATION ---
        emailjs.init("YOUR_PUBLIC_KEY_HERE"); // PASTE YOUR PUBLIC KEY HERE

        window.sendBroadcast = async () => {
            const subject = document.getElementById('email-subject').value;
            const message = document.getElementById('broadcast-msg').value;
            const btn = document.getElementById('broadcast-btn');
            const status = document.getElementById('broadcast-status');

            if (!subject || !message) return alert("Fill all fields");

            btn.disabled = true;
            btn.innerText = "SENDING...";
            status.innerText = "Accessing User Database...";

            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                let sentCount = 0;
                for (const userDoc of querySnapshot.docs) {
                    const email = userDoc.data().email;
                    if (email) {
                        await emailjs.send("service_8l6ng22", "YOUR_TEMPLATE_ID_HERE", {
                            subject: subject,
                            message: message,
                            user_email: email,
                            admin_email: "contactsuportremoteworkings@gmail.com"
                        });
                        sentCount++;
                    }
                }
                status.innerText = `SUCCESS: SENT TO ${sentCount} WORKERS`;
                status.className = "text-green-500 uppercase text-[10px] font-black";
            } catch (err) {
                console.error(err);
                status.innerText = "ERROR IN SENDING";
                status.className = "text-red-500 uppercase text-[10px] font-black";
            } finally {
                btn.disabled = false;
                btn.innerText = "Send To All Workers";
            }
        };

        // --- PRODUCT MANAGEMENT ---
        window.addProduct = async () => {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const tasks = document.getElementById('p-tasks').value;

            if (!name || !price) return alert("Fill name/price");

            try {
                await addDoc(collection(db, "products"), {
                    name,
                    price: parseFloat(price),
                    tasks,
                    createdAt: serverTimestamp()
                });
                alert("Published Successfully!");
                document.getElementById('p-name').value = "";
                document.getElementById('p-price').value = "";
                document.getElementById('p-tasks').value = "";
            } catch (e) { alert(e.message); }
        };

        // --- LOAD LISTINGS ---
        onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), (snapshot) => {
            const list = document.getElementById('admin-list');
            list.innerHTML = "";
            snapshot.forEach(docSnap => {
                const p = docSnap.data();
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-white/5 p-4 rounded-2xl border border-white/5";
                item.innerHTML = `
                    <div>
                        <p class="font-black italic uppercase text-sm">${p.name}</p>
                        <p class="text-[10px] text-blue-400 font-bold">$${p.price}</p>
                    </div>
                    <button onclick="deleteProduct('${docSnap.id}')" class="text-[9px] font-black uppercase text-red-500 bg-red-500/10 px-4 py-2 rounded-xl">Delete</button>
                `;
                list.appendChild(item);
            });
        });

        window.deleteProduct = async (id) => {
            if (confirm("Permanently delete this item?")) {
                await deleteDoc(doc(db, "products", id));
            }
        };
    </script>
</body>
</html>
