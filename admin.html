<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | WORKING REMOTELY HEADQUARTERS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script>
        (function() {
            const accessKey = prompt("RESTRICTED ACCESS: Enter Admin Key to continue:");
            if (accessKey !== "SRC3838") {
                alert("ACCESS DENIED");
                window.location.href = "index.html";
            }
        })();
    </script>

    <style>
        body { background: #020617; font-family: sans-serif; color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        input, textarea, select { transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; background: #0f172a !important; }
        input:focus, textarea:focus, select:focus { border-color: #3b82f6 !important; outline: none; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
        .status-pill { font-size: 8px; font-weight: 900; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-5xl mx-auto pb-20">
        <div class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-2xl font-black italic uppercase tracking-tighter text-blue-500">Jubilee Fortunes Admin</h1>
                <p class="text-[9px] font-bold text-gray-500 uppercase tracking-[0.3em]">contactsuportremoteworkings@gmail.com</p>
            </div>
            <div class="flex gap-3">
                <a href="https://www.pesapal.com/dashboard" target="_blank" class="text-[10px] font-black uppercase bg-blue-600/20 text-blue-400 border border-blue-500/30 px-4 py-2 rounded-xl">Pesapal Login</a>
                <a href="index.html" class="text-[10px] font-black uppercase bg-red-600/20 text-red-500 border border-red-500/30 px-6 py-2 rounded-xl hover:bg-red-600 hover:text-white transition">Exit</a>
            </div>
        </div>

        <div class="mb-12">
            <h2 class="text-[10px] font-black uppercase mb-4 italic text-yellow-500 tracking-widest border-b border-yellow-500/20 pb-2">Verification Center (Pending Payments)</h2>
            <div id="payment-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <p class="text-[10px] text-gray-600 font-bold italic uppercase py-4">Scanning for new M-Pesa/Pesapal logs...</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-10">
            
            <div class="glass-card p-8 rounded-[2.5rem] border-t-4 border-yellow-500 shadow-2xl lg:col-span-1">
                <h2 class="text-sm font-black uppercase mb-6 italic text-yellow-500"><i class="fas fa-bullhorn mr-2"></i>Email Workers</h2>
                <div class="space-y-4">
                    <input type="text" id="email-subject" placeholder="Promotion Subject" class="w-full p-4 rounded-2xl text-xs font-bold">
                    <textarea id="broadcast-msg" placeholder="Message content..." class="w-full p-4 rounded-2xl text-xs font-bold h-32"></textarea>
                    <button onclick="sendBroadcast()" id="broadcast-btn" class="w-full bg-yellow-600 text-white py-4 rounded-2xl font-black uppercase italic text-[10px] shadow-lg hover:bg-yellow-500 transition">Execute Broadcast</button>
                    <p id="broadcast-status" class="text-[9px] font-black uppercase text-center mt-2 text-gray-400"></p>
                </div>
            </div>

            <div class="glass-card p-8 rounded-[2.5rem] border-t-4 border-green-500 shadow-2xl lg:col-span-1">
                <h2 class="text-sm font-black uppercase mb-6 italic text-green-500"><i class="fas fa-graduation-cap mr-2"></i>Training Hub</h2>
                <div class="space-y-4">
                    <input type="text" id="pdfTitle" placeholder="Module Title" class="w-full p-4 rounded-2xl text-xs font-bold">
                    <input type="text" id="pdfExternalUrl" placeholder="Vercel PDF/Task Link" class="w-full p-4 rounded-2xl text-xs font-bold">
                    
                    <div class="flex flex-col gap-2">
                        <label class="text-[9px] font-black uppercase text-gray-500 ml-2">Access Level</label>
                        <select id="trainStatus" class="w-full p-4 rounded-2xl text-xs font-bold cursor-pointer">
                            <option value="free">FREE (Public)</option>
                            <option value="premium">PREMIUM ($10 Required)</option>
                        </select>
                    </div>
                    
                    <button onclick="addTrainingByLink()" id="addBtn" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black uppercase italic text-[10px] hover:bg-green-500 transition shadow-xl">Publish Module</button>
                </div>
            </div>

            <div class="glass-card p-8 rounded-[2.5rem] border-t-4 border-blue-500 shadow-2xl lg:col-span-1">
                <h2 class="text-sm font-black uppercase mb-6 italic text-blue-500"><i class="fas fa-shopping-bag mr-2"></i>Marketplace</h2>
                <div class="space-y-4">
                    <input type="text" id="p-name" placeholder="Package Name" class="w-full p-4 rounded-2xl text-xs font-bold">
                    <input type="number" id="p-price" placeholder="Price (USD)" class="w-full p-4 rounded-2xl text-xs font-bold">
                    <textarea id="p-tasks" placeholder="Package brief..." class="w-full p-4 rounded-2xl text-xs font-bold h-24"></textarea>
                    <button onclick="addProduct()" class="w-full bg-blue-600 p-4 rounded-2xl font-black uppercase italic text-[10px] hover:bg-blue-500 transition shadow-xl">List Package</button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="glass-card p-8 rounded-[3rem]">
                <h2 class="text-[10px] font-black uppercase mb-6 italic text-blue-500 tracking-widest border-b border-white/5 pb-2">Active Products</h2>
                <div id="admin-list" class="space-y-3"></div>
            </div>
            <div class="glass-card p-8 rounded-[3rem]">
                <h2 class="text-[10px] font-black uppercase mb-6 italic text-green-500 tracking-widest border-b border-white/5 pb-2">Training Modules</h2>
                <div id="training-list" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE", 
            authDomain: "remoteworkingacess.firebaseapp.com", 
            projectId: "remoteworkingacess", 
            storageBucket: "remoteworkingacess.firebasestorage.app", 
            messagingSenderId: "953179052891", 
            appId: "1:953179052891:web:8126924e32e9fb62f4987e" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        emailjs.init("bknDLORLRGE4fjaQU"); 

        // --- NEW: VERIFICATION LOGIC ---
        onSnapshot(query(collection(db, "payment_submissions"), orderBy("createdAt", "desc")), (snap) => {
            const list = document.getElementById('payment-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const data = d.data();
                if(data.status === "pending") {
                    const div = document.createElement('div');
                    div.className = "glass-card p-5 rounded-3xl border-l-4 border-yellow-500 flex flex-col gap-2";
                    div.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-[10px] font-black text-white">${data.userEmail}</p>
                                <p class="text-[8px] font-bold text-gray-500 uppercase">${data.method} | $${data.amount}</p>
                            </div>
                            <span class="status-pill bg-yellow-600/20 text-yellow-500 italic">Pending</span>
                        </div>
                        <p class="text-[9px] font-bold text-blue-400">ITEM: ${data.itemName || 'Premium Access'}</p>
                        <div class="flex gap-2 mt-2">
                            <button onclick="approveUser('${d.id}', '${data.userEmail}')" class="bg-green-600 text-white px-4 py-2 rounded-xl font-black text-[9px] uppercase italic flex-1">Approve Premium</button>
                            <button onclick="deleteItem('payment_submissions','${d.id}')" class="bg-red-600/10 text-red-500 px-3 rounded-xl"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    list.appendChild(div);
                }
            });
        });

        window.approveUser = async (subId, email) => {
            if(confirm("Verify payment and unlock Premium for: " + email + "?")) {
                try {
                    // 1. Mark payment as approved
                    await updateDoc(doc(db, "payment_submissions", subId), { status: "approved" });
                    // 2. Unlock User's Premium Status
                    await updateDoc(doc(db, "users", email), { isPremium: true });
                    alert("SUCCESS: User is now PREMIUM!");
                } catch (e) {
                    alert("Error: Ensure user document exists in 'users' collection.");
                }
            }
        };

        // --- BROADCAST LOGIC ---
        window.sendBroadcast = async () => {
            const subject = document.getElementById('email-subject').value;
            const message = document.getElementById('broadcast-msg').value;
            const btn = document.getElementById('broadcast-btn');
            const status = document.getElementById('broadcast-status');
            if (!subject || !message) return alert("Fill subject and message.");
            btn.disabled = true; btn.innerText = "SENDING...";
            try {
                const snapshot = await getDocs(collection(db, "users"));
                let count = 0;
                for (const uDoc of snapshot.docs) {
                    let email = uDoc.data().email;
                    if (email) {
                        await emailjs.send("service_8l6ng22", "template_n1t3m08", {
                            subject: subject, message: message, user_email: email.trim(), 
                            admin_email: "contactsuportremoteworkings@gmail.com"
                        });
                        count++;
                        await new Promise(r => setTimeout(r, 1500));
                    }
                }
                status.innerText = `SUCCESS: SENT TO ${count} WORKERS`;
                alert("Broadcast Complete!");
            } catch (err) { alert(err.message); }
            btn.disabled = false; btn.innerText = "Execute Broadcast";
        };

        // --- TRAINING LOGIC ---
        window.addTrainingByLink = async () => {
            const title = document.getElementById('pdfTitle').value;
            const url = document.getElementById('pdfExternalUrl').value;
            const status = document.getElementById('trainStatus').value;
            if(!title || !url) return alert("Enter title and link.");
            try {
                await addDoc(collection(db, "training_modules"), {
                    title, pdfUrl: url, status: status, createdAt: serverTimestamp()
                });
                alert("Module Successfully Published!");
                document.getElementById('pdfTitle').value = "";
                document.getElementById('pdfExternalUrl').value = "";
            } catch (e) { alert(e.message); }
        };

        // --- MARKETPLACE LOGIC ---
        window.addProduct = async () => {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const tasks = document.getElementById('p-tasks').value;
            if (!name || !price) return alert("Enter name and price.");
            try {
                await addDoc(collection(db, "products"), { name, price: parseFloat(price), tasks, createdAt: serverTimestamp() });
                alert("Product Package Added!");
                document.getElementById('p-name').value = "";
                document.getElementById('p-price').value = "";
            } catch (e) { alert(e.message); }
        };

        // --- LIVE SYNC ---
        onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), (snap) => {
            const list = document.getElementById('admin-list'); list.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-white/5 p-4 rounded-2xl border border-white/5";
                div.innerHTML = `<div><p class="font-black italic uppercase text-[10px]">${p.name}</p><p class="text-[9px] text-blue-400 font-bold">$${p.price}</p></div>
                <button onclick="deleteItem('products','${d.id}')" class="text-[8px] font-black text-red-500 uppercase">Remove</button>`;
                list.appendChild(div);
            });
        });

        onSnapshot(query(collection(db, "training_modules"), orderBy("createdAt", "desc")), (snap) => {
            const list = document.getElementById('training-list'); list.innerHTML = "";
            snap.forEach(d => {
                const t = d.data();
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-white/5 p-4 rounded-2xl border border-white/5";
                div.innerHTML = `<div><p class="font-black italic uppercase text-[10px]">${t.title}</p><p class="text-[8px] font-black ${t.status === 'premium' ? 'text-yellow-500' : 'text-green-500'} uppercase">${t.status}</p></div>
                <button onclick="deleteItem('training_modules','${d.id}')" class="text-[8px] font-black text-red-500 uppercase">Remove</button>`;
                list.appendChild(div);
            });
        });

        window.deleteItem = async (c, id) => {
            if(confirm("Permanently delete this item?")) await deleteDoc(doc(db, c, id));
        };
    </script>
</body>
</html>
