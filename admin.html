<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | WORKING REMOTELY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f0f2f5; font-family: sans-serif; }
        .admin-card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="p-4 md:p-8">

    <nav class="max-w-7xl mx-auto flex justify-between items-center mb-10">
        <h1 class="text-2xl font-black uppercase italic text-blue-900">Jubilee Fortunes Admin</h1>
        <button onclick="logout()" class="bg-red-600 text-white px-6 py-2 rounded-full font-bold text-xs uppercase">Logout</button>
    </nav>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <section class="lg:col-span-1">
            <div class="admin-card p-6">
                <h2 class="text-lg font-black uppercase mb-6 border-b pb-2">Add New Account</h2>
                <div class="space-y-4">
                    <input id="p-name" type="text" placeholder="Account Name (e.g. PROLIFIC)" class="w-full p-3 rounded-lg border font-bold text-sm">
                    <input id="p-price" type="number" placeholder="Price (USD)" class="w-full p-3 rounded-lg border font-bold text-sm">
                    <textarea id="p-tasks" placeholder="Task Details / Description" class="w-full p-3 rounded-lg border font-bold text-sm h-32"></textarea>
                    <button onclick="addProduct()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-black uppercase tracking-widest hover:bg-black transition">Post to Shop</button>
                </div>
            </div>
        </section>

        <section class="lg:col-span-2">
            <div class="admin-card p-6">
                <h2 class="text-lg font-black uppercase mb-6 border-b pb-2">Live Shop Items</h2>
                <div id="admin-product-list" class="space-y-4">
                    <p class="text-gray-400 italic text-sm">Loading inventory...</p>
                </div>
            </div>
        </section>

    </main>

    <script type="text/javascript">
        var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
        Tawk_API.customStyle = {
            visibility : {
                desktop : { position : 'br', xOffset : 20, yOffset : 20 },
                mobile : { position : 'br', xOffset : 15, yOffset : 85 }
            }
        };
        (function(){
            var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
            s1.async=true;
            // Updated to match your specific dashboard ID
            s1.src='https://embed.tawk.to/6797549464a0f82197e62180/1jfp2cf6e'; 
            s1.charset='UTF-8';
            s1.setAttribute('crossorigin','*');
            s0.parentNode.insertBefore(s1,s0);
        })();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE", authDomain: "remoteworkingacess.firebaseapp.com", projectId: "remoteworkingacess", storageBucket: "remoteworkingacess.firebasestorage.app", messagingSenderId: "953179052891", appId: "1:953179052891:web:8126924e32e9fb62f4987e" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Security Check
        onAuthStateChanged(auth, (user) => {
            if (!user || user.email !== "jubileefortunesinvestments@gmail.com") {
                window.location.href = "login.html";
            } else {
                fetchProducts();
            }
        });

        window.addProduct = async () => {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const tasks = document.getElementById('p-tasks').value;

            if(!name || !price) return alert("Fill required fields");

            try {
                await addDoc(collection(db, "products"), {
                    name: name.toUpperCase(),
                    price: price,
                    tasks: tasks,
                    createdAt: serverTimestamp()
                });
                alert("Product Added!");
                document.getElementById('p-name').value = "";
                document.getElementById('p-price').value = "";
                document.getElementById('p-tasks').value = "";
            } catch (e) { alert("Error adding product"); }
        };

        function fetchProducts() {
            const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('admin-product-list');
                list.innerHTML = "";
                snapshot.forEach((pDoc) => {
                    const p = pDoc.data();
                    list.innerHTML += `
                        <div class="flex justify-between items-center p-4 border-b hover:bg-gray-50">
                            <div>
                                <p class="font-black text-blue-900">${p.name}</p>
                                <p class="text-xs font-bold text-gray-500">$${p.price}</p>
                            </div>
                            <button onclick="deleteProduct('${pDoc.id}')" class="text-red-600 font-bold text-xs uppercase border border-red-200 px-3 py-1 rounded-lg hover:bg-red-50">Remove</button>
                        </div>`;
                });
            });
        }

        window.deleteProduct = async (id) => {
            if(confirm("Delete this item permanently?")) {
                await deleteDoc(doc(db, "products", id));
            }
        };

        window.logout = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
