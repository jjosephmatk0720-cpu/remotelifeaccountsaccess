<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | WORKING REMOTELY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script>
        (function() {
            const accessKey = prompt("RESTRICTED ACCESS: Enter Admin Key to continue:");
            if (accessKey !== "SRC3838") {
                alert("ACCESS DENIED");
                window.location.href = "index.html";
            }
        })();
    </script>

    <style>
        body { background: #0f172a; font-family: sans-serif; color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        input, textarea { transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.05) !important; color: white; }
        input:focus, textarea:focus { border-color: #3b82f6 !important; background: rgba(30, 41, 59, 1) !important; outline: none; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto pb-20">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-2xl font-black italic uppercase tracking-tighter text-blue-500">WORKING REMOTELY Admin</h1>
            <a href="index.html" class="text-xs font-bold uppercase bg-white text-black px-4 py-2 rounded-full hover:bg-blue-500 hover:text-white transition">Exit Panel</a>
        </div>

        <div class="glass-card p-8 rounded-[2.5rem] mb-10 border-l-4 border-yellow-500 shadow-2xl">
            <h2 class="text-lg font-black uppercase mb-2 italic text-yellow-500">Bulk Email Broadcast</h2>
            <p class="text-[10px] text-gray-400 mb-6 uppercase font-bold tracking-widest">Sending via contactsuportremoteworkings@gmail.com</p>
            <div class="space-y-4">
                <input type="text" id="email-subject" placeholder="Promotion Subject" class="w-full p-4 bg-gray-800 rounded-2xl text-sm font-bold">
                <textarea id="broadcast-msg" placeholder="Type your promotion message here..." class="w-full p-4 bg-gray-800 rounded-2xl text-sm font-bold h-32"></textarea>
                <button onclick="sendBroadcast()" id="broadcast-btn" class="w-full bg-yellow-500 text-black py-4 rounded-2xl font-black uppercase italic tracking-widest shadow-lg hover:bg-yellow-400 transition">Send To All Workers</button>
                <p id="broadcast-status" class="text-[10px] font-black uppercase text-center mt-2"></p>
            </div>
        </div>

        <div class="glass-card p-8 rounded-[2.5rem] mb-10 border-l-4 border-green-500 shadow-2xl">
            <h2 class="text-lg font-black uppercase mb-6 italic text-green-500">Link New Training PDF</h2>
            <div class="space-y-4">
                <input type="text" id="pdfTitle" placeholder="Module Title (e.g. Data Entry Guide)" class="w-full p-4 bg-gray-800 rounded-2xl text-sm font-bold">
                <textarea id="pdfDesc" placeholder="Brief Description..." class="w-full p-4 bg-gray-800 rounded-2xl text-sm font-bold h-20"></textarea>
                <input type="text" id="pdfExternalUrl" placeholder="Vercel PDF Link (https://...)" class="w-full p-4 bg-gray-800 rounded-2xl text-sm font-bold border-2 border-blue-500/30">
                <button onclick="addTrainingByLink()" id="addBtn" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black uppercase italic tracking-widest hover:bg-green-500 transition shadow-xl">Publish to Training Page</button>
            </div>
        </div>

        <div class="glass-card p-8 rounded-[2.5rem] mb-10 border-l-4 border-blue-500 shadow-2xl">
            <h2 class="text-lg font-black uppercase mb-6 italic text-blue-500">Manage Marketplace</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="p-name" placeholder="Package Name" class="p-4 bg-gray-800 rounded-2xl text-sm font-bold">
                <input type="number" id="p-price" placeholder="Price (USD)" class="p-4 bg-gray-800 rounded-2xl text-sm font-bold">
                <textarea id="p-tasks" placeholder="Package Description" class="p-4 bg-gray-800 rounded-2xl text-sm font-bold md:col-span-2 h-24"></textarea>
                <button onclick="addProduct()" class="md:col-span-2 bg-blue-600 p-4 rounded-2xl font-black uppercase italic tracking-widest hover:bg-blue-500 transition shadow-xl">Add Package</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass-card p-8 rounded-[2.5rem] shadow-2xl">
                <h2 class="text-xs font-black uppercase mb-6 italic text-gray-500">Live Marketplace</h2>
                <div id="admin-list" class="space-y-3"></div>
            </div>
            <div class="glass-card p-8 rounded-[2.5rem] shadow-2xl">
                <h2 class="text-xs font-black uppercase mb-6 italic text-gray-500">Live Trainings</h2>
                <div id="training-list" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE", 
            authDomain: "remoteworkingacess.firebaseapp.com", 
            projectId: "remoteworkingacess", 
            storageBucket: "remoteworkingacess.firebasestorage.app", 
            messagingSenderId: "953179052891", 
            appId: "1:953179052891:web:8126924e32e9fb62f4987e" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        emailjs.init("bknDLORLRGE4fjaQU"); 

        // --- BROADCAST LOGIC ---
        window.sendBroadcast = async () => {
            const subject = document.getElementById('email-subject').value;
            const message = document.getElementById('broadcast-msg').value;
            const btn = document.getElementById('broadcast-btn');
            const status = document.getElementById('broadcast-status');
            if (!subject || !message) return alert("Fill subject and message.");
            btn.disabled = true; btn.innerText = "SENDING...";
            try {
                const snapshot = await getDocs(collection(db, "users"));
                let count = 0;
                for (const uDoc of snapshot.docs) {
                    let email = uDoc.data().email;
                    if (email) {
                        await emailjs.send("service_8l6ng22", "template_n1t3m08", {
                            subject: subject, message: message, user_email: email.trim(), 
                            admin_email: "contactsuportremoteworkings@gmail.com"
                        });
                        count++;
                        await new Promise(r => setTimeout(r, 1500));
                    }
                }
                status.innerText = `SUCCESS: SENT TO ${count}`;
                alert("Broadcast Complete!");
            } catch (err) { alert(err.message); }
            btn.disabled = false; btn.innerText = "Send To All Workers";
        };

        // --- TRAINING LINK LOGIC ---
        window.addTrainingByLink = async () => {
            const title = document.getElementById('pdfTitle').value;
            const desc = document.getElementById('pdfDesc').value;
            const url = document.getElementById('pdfExternalUrl').value;
            if(!title || !url) return alert("Enter title and Vercel link.");
            try {
                await addDoc(collection(db, "training_modules"), {
                    title, description: desc, pdfUrl: url, createdAt: serverTimestamp()
                });
                alert("Training Published!");
                location.reload();
            } catch (e) { alert(e.message); }
        };

        // --- MARKETPLACE LOGIC ---
        window.addProduct = async () => {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const tasks = document.getElementById('p-tasks').value;
            if (!name || !price) return alert("Enter name and price.");
            try {
                await addDoc(collection(db, "products"), { name, price: parseFloat(price), tasks, createdAt: serverTimestamp() });
                alert("Package Added!");
            } catch (e) { alert(e.message); }
        };

        // --- LIVE SYNC ---
        onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), (snap) => {
            const list = document.getElementById('admin-list'); list.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-white/5 p-4 rounded-2xl border border-white/5";
                div.innerHTML = `<div><p class="font-black italic uppercase text-[10px]">${p.name}</p><p class="text-[9px] text-blue-400">$${p.price}</p></div>
                <button onclick="deleteItem('products','${d.id}')" class="text-[8px] font-black text-red-500">Delete</button>`;
                list.appendChild(div);
            });
        });

        onSnapshot(query(collection(db, "training_modules"), orderBy("createdAt", "desc")), (snap) => {
            const list = document.getElementById('training-list'); list.innerHTML = "";
            snap.forEach(d => {
                const t = d.data();
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-white/5 p-4 rounded-2xl border border-white/5";
                div.innerHTML = `<div><p class="font-black italic uppercase text-[10px]">${t.title}</p><p class="text-[9px] text-green-400">PDF Linked</p></div>
                <button onclick="deleteItem('training_modules','${d.id}')" class="text-[8px] font-black text-red-500">Delete</button>`;
                list.appendChild(div);
            });
        });

        window.deleteItem = async (c, id) => {
            if(confirm("Confirm Delete?")) await deleteDoc(doc(db, c, id));
        };
    </script>
</body>
</html>
