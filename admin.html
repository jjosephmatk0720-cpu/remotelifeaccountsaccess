<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Working Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .admin-bg { background: #0f172a; color: white; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        body { opacity: 0; transition: opacity 0.5s; }
    </style>
</head>
<body id="main-body" class="admin-bg min-h-screen font-sans p-6">

    <nav class="max-w-7xl mx-auto flex justify-between items-center mb-10">
        <h1 class="text-2xl font-black italic uppercase tracking-tighter">Admin <span class="text-blue-500">Panel</span></h1>
        <div class="flex space-x-4">
            <a href="shop.html" class="text-[10px] font-black uppercase tracking-widest py-2 px-4 border border-white/20 rounded-full hover:bg-white hover:text-black transition">View Shop</a>
            <button onclick="logout()" class="text-[10px] font-black uppercase tracking-widest py-2 px-4 bg-red-600 rounded-full">Logout</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-1 space-y-6">
            <div class="glass-panel p-6 rounded-[2rem]">
                <h2 class="text-sm font-black uppercase tracking-widest text-blue-400 mb-6 italic">🏆 Top Recruiters</h2>
                <div id="leaderboard" class="space-y-4">
                    <p class="text-xs text-gray-500 italic">Calculating rankings...</p>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-6">
            <div class="glass-panel p-6 rounded-[2rem]">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-sm font-black uppercase tracking-widest text-green-400 italic">📦 Inventory Management</h2>
                    <span class="text-[9px] font-bold text-gray-400 uppercase">Click 'Delete' to remove sold items</span>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-[10px] font-black uppercase text-gray-500 border-b border-white/10">
                                <th class="pb-4 px-2">Account Name</th>
                                <th class="pb-4 px-2 text-center">Price</th>
                                <th class="pb-4 px-2 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-list" class="divide-y divide-white/5">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE",
            authDomain: "remoteworkingacess.firebaseapp.com",
            projectId: "remoteworkingacess",
            storageBucket: "remoteworkingacess.firebasestorage.app",
            messagingSenderId: "953179052891",
            appId: "1:953179052891:web:8126924e32e9fb62f4987e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- ADMIN SECURITY KEY ---
        const ADMIN_KEY = "SRC3838";

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "index.html";
            } else {
                const access = prompt("ENTER ADMIN ACCESS KEY:");
                if (access !== ADMIN_KEY) {
                    alert("ACCESS DENIED");
                    window.location.href = "shop.html";
                } else {
                    document.getElementById('main-body').style.opacity = "1";
                    loadLeaderboard();
                    loadInventory();
                }
            }
        });

        // 🏆 CALCULATE RECRUITER STATS
        async function loadLeaderboard() {
            try {
                const usersSnap = await getDocs(collection(db, "users"));
                const referralCounts = {};

                usersSnap.forEach(userDoc => {
                    const data = userDoc.data();
                    if (data.referredBy && data.referredBy !== "none") {
                        referralCounts[data.referredBy] = (referralCounts[data.referredBy] || 0) + 1;
                    }
                });

                const leaderboardEl = document.getElementById('leaderboard');
                leaderboardEl.innerHTML = "";
                const sorted = Object.entries(referralCounts).sort((a, b) => b[1] - a[1]);

                if (sorted.length === 0) {
                    leaderboardEl.innerHTML = "<p class='text-[10px] text-gray-500 uppercase'>No active recruiters yet.</p>";
                    return;
                }

                sorted.forEach(([id, count], index) => {
                    leaderboardEl.innerHTML += `
                        <div class="flex justify-between items-center p-3 bg-white/5 rounded-xl border border-white/5">
                            <div class="flex items-center space-x-3">
                                <span class="text-xs font-black ${index === 0 ? 'text-yellow-400' : 'text-blue-500'}">#${index + 1}</span>
                                <span class="text-[9px] font-bold text-gray-300">ID: ...${id.slice(-6)}</span>
                            </div>
                            <span class="text-[9px] font-black bg-blue-600 px-2 py-1 rounded text-white">${count} RECRUITS</span>
                        </div>`;
                });
            } catch (e) { console.error(e); }
        }

        // 📦 PRODUCT MANAGER
        async function loadInventory() {
            try {
                const list = document.getElementById('inventory-list');
                const productsSnap = await getDocs(collection(db, "products"));
                list.innerHTML = "";

                productsSnap.forEach((productDoc) => {
                    const data = productDoc.data();
                    list.innerHTML += `
                        <tr class="text-[11px] font-bold">
                            <td class="py-4 px-2 uppercase tracking-tight">${data.name}</td>
                            <td class="py-4 px-2 text-center text-blue-400 font-black">$${data.price}</td>
                            <td class="py-4 px-2 text-right">
                                <button onclick="deleteProduct('${productDoc.id}')" class="bg-red-900/40 text-red-400 px-3 py-1 rounded-lg border border-red-900/50 hover:bg-red-600 hover:text-white transition uppercase text-[9px] font-black">Delete Sold</button>
                            </td>
                        </tr>`;
                });
            } catch (e) { console.error(e); }
        }

        window.deleteProduct = async (id) => {
            if (confirm("Permanently remove this SOLD account from the shop?")) {
                try {
                    await deleteDoc(doc(db, "products", id));
                    alert("Account Deleted.");
                    loadInventory();
                } catch (error) {
                    alert("Error: " + error.message);
                }
            }
        };

        window.logout = () => signOut(auth).then(() => window.location.href = "index.html");
    </script>
</body>
</html>
