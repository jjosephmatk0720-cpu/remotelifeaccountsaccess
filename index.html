<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Access | Working Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hero-bg {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), 
                        url('https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center;
        }
        .glass-card { background: white; backdrop-filter: blur(10px); }
    </style>
</head>
<body class="hero-bg min-h-screen flex items-center justify-center p-6 text-gray-800 font-sans">
    <div class="glass-card w-full max-w-md rounded-[2.5rem] shadow-2xl p-10 border border-white/20">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-blue-800 uppercase italic tracking-tighter">Working Remote</h1>
            <p id="form-title" class="text-gray-400 font-bold text-[10px] uppercase tracking-[0.2em] mt-2">Sign In to Your Account</p>
        </div>
        <div class="space-y-5">
            <input type="email" id="email" placeholder="Email Address" class="w-full bg-gray-50 p-4 rounded-2xl border border-gray-100 outline-none focus:border-blue-500 font-medium">
            <input type="password" id="pass" placeholder="Password" class="w-full bg-gray-50 p-4 rounded-2xl border border-gray-100 outline-none focus:border-blue-500 font-medium">
            <button id="main-btn" onclick="handleAuth()" class="w-full bg-blue-700 text-white py-4 rounded-2xl font-black text-xs hover:bg-black shadow-xl transition-all uppercase italic tracking-widest">Login</button>
            <div class="text-center">
                <p id="toggle-text" class="text-xs text-gray-500 font-medium">Don't have an account?</p>
                <button id="toggle-btn" onclick="switchMode()" class="text-xs font-black text-blue-700 uppercase tracking-wider mt-1 hover:underline">Create Account</button>
            </div>
        </div>
        <p id="msg" class="mt-6 text-center text-[10px] font-bold uppercase tracking-tight"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE",
            authDomain: "remoteworkingacess.firebaseapp.com",
            projectId: "remoteworkingacess",
            storageBucket: "remoteworkingacess.firebasestorage.app",
            messagingSenderId: "953179052891",
            appId: "1:953179052891:web:8126924e32e9fb62f4987e"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user && user.emailVerified) { window.location.href = "shop.html"; }
        });

        let isLoginMode = true;
        window.switchMode = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('form-title').innerText = isLoginMode ? "Sign In" : "Join the Community";
            document.getElementById('main-btn').innerText = isLoginMode ? "Login" : "Create Account";
        };

        window.handleAuth = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try {
                if (isLoginMode) {
                    const userCredential = await signInWithEmailAndPassword(auth, email, pass);
                    if (!userCredential.user.emailVerified) return alert("Verify your email first!");
                    window.location.href = "shop.html";
                } else {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                    await sendEmailVerification(userCredential.user);
                    alert("Verification link sent!");
                    switchMode();
                }
            } catch (error) { alert(error.message); }
        };
    </script>
</body>
</html>
