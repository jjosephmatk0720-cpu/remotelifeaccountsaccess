<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | Working Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .blur-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="hero-bg min-h-screen text-gray-900 font-sans">

    <nav class="p-6 flex justify-between items-center max-w-7xl mx-auto">
        <h1 class="text-2xl font-black text-white italic tracking-tighter uppercase">Working Remote</h1>
        <div class="space-x-4">
            <a href="profile.html" class="text-white text-xs font-bold uppercase tracking-widest hover:text-blue-400 transition">Profile</a>
            <button onclick="logout()" class="bg-red-600 text-white px-5 py-2 rounded-full text-xs font-black uppercase italic tracking-widest hover:bg-black transition">Logout</button>
        </div>
    </nav>

    <header class="text-center py-16 px-6">
        <h2 class="text-5xl md:text-7xl font-black text-white uppercase italic tracking-tighter mb-4">The Marketplace</h2>
        <p class="text-blue-400 font-bold uppercase tracking-[0.3em] text-xs">Verified Access Only</p>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="blur-card p-8 rounded-[2rem] shadow-2xl border border-white/20 text-center">
                <div class="w-20 h-20 bg-blue-100 rounded-2xl mx-auto mb-6 flex items-center justify-center">
                    <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h3 class="text-xl font-black uppercase italic tracking-tight mb-2">Loading Assets...</h3>
                <p class="text-gray-500 text-sm font-medium mb-6">Connecting to secure database</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE",
            authDomain: "remoteworkingacess.firebaseapp.com",
            projectId: "remoteworkingacess",
            storageBucket: "remoteworkingacess.firebasestorage.app",
            messagingSenderId: "953179052891",
            appId: "1:953179052891:web:8126924e32e9fb62f4987e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 🔒 THE SECURITY GUARD
        onAuthStateChanged(auth, (user) => {
            if (!user || !user.emailVerified) {
                // If stranger or unverified, kick to login.html
                window.location.href = "login.html";
            } else {
                console.log("Logged in as:", user.email);
                loadProducts();
            }
        });

        // Logout Function
        window.logout = () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            });
        };

        // Load Products Logic
        async function loadProducts() {
            const grid = document.getElementById('product-grid');
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                grid.innerHTML = ""; // Clear loader
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    grid.innerHTML += `
                        <div class="blur-card p-8 rounded-[2rem] shadow-2xl border border-white/20 transition-transform hover:scale-[1.02]">
                            <h3 class="text-2xl font-black uppercase italic tracking-tighter mb-2 text-blue-800">${data.name || 'Account'}</h3>
                            <p class="text-gray-600 text-sm font-bold mb-6">${data.description || 'Premium Remote Access'}</p>
                            <div class="flex justify-between items-center pt-4 border-t border-gray-100">
                                <span class="text-2xl font-black text-black">$${data.price || '0.00'}</span>
                                <button class="bg-blue-700 text-white px-6 py-3 rounded-xl font-black text-xs uppercase italic tracking-widest hover:bg-black transition">Buy Now</button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error loading products:", error);
                grid.innerHTML = `<p class="text-white font-bold">Error loading items. Check permissions.</p>`;
            }
        }
    </script>
</body>
</html>
