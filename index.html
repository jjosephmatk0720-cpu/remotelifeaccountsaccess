<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Remote | Global Account Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(rgba(10, 15, 30, 0.85), rgba(10, 15, 30, 0.85)), 
                        url('https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
    
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    (function(){
    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
    s1.async=true;
    s1.src='https://embed.tawk.to/697549464a0f82197e621807/1jfp2cf6e';
    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>
</head>
<body class="text-slate-900">

    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 p-5 px-8 flex justify-between items-center shadow-xl">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-blue-700 rounded-xl flex items-center justify-center text-white font-black italic shadow-blue-500/50 shadow-lg">WR</div>
            <h1 class="text-xl font-extrabold tracking-tighter text-slate-800 uppercase italic">Working Remote</h1>
        </div>
        <button onclick="toggleCart()" class="bg-slate-100 p-3 rounded-2xl relative hover:bg-blue-600 hover:text-white transition-all">
            🛒 <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">0</span>
        </button>
    </nav>

    <main class="max-w-7xl mx-auto py-16 px-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-12">
            <div>
                <h2 class="text-4xl font-black text-white italic uppercase tracking-tighter">Verified Inventory</h2>
                <p class="text-blue-400 text-xs font-bold uppercase tracking-[0.3em] mt-2">Ready-To-Work Assets • Instant Delivery</p>
            </div>
            <div class="bg-blue-600/30 border border-blue-400 text-blue-100 px-6 py-3 rounded-2xl text-[10px] font-black uppercase italic animate-pulse">
                🔥 BUNDLE DEAL: 2+ Accounts = 10% OFF
            </div>
        </div>

        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <div id="cart-drawer" class="fixed right-0 top-0 h-full w-full max-w-sm bg-white shadow-2xl z-[60] transform translate-x-full transition-transform duration-500 p-8 flex flex-col">
        <div class="flex justify-between items-center mb-8">
            <h4 class="text-2xl font-black uppercase italic text-slate-800">Your Basket</h4>
            <button onclick="toggleCart()" class="text-slate-400 hover:text-black">✕</button>
        </div>
        <div id="cart-list" class="flex-1 overflow-y-auto space-y-4"></div>
        <div class="border-t border-slate-100 pt-6 mt-6">
            <div id="discount-notice"></div>
            <div class="flex justify-between items-center mb-6">
                <span class="text-slate-400 font-bold uppercase text-[10px]">Total Price</span>
                <span id="cart-total" class="text-4xl font-black text-blue-700 tracking-tighter">$0</span>
            </div>
            <button onclick="openSupportCenter()" class="w-full bg-blue-700 text-white py-5 rounded-3xl font-black text-sm uppercase italic tracking-widest hover:bg-black transition-all">
                Finalize Purchase
            </button>
        </div>
    </div>

    <div id="support-modal" class="fixed inset-0 bg-slate-900/95 backdrop-blur-xl hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-10">
            <h3 class="text-2xl font-black text-center mb-8 uppercase italic">Transaction Desk</h3>
            <div class="space-y-4">
                <button onclick="openLiveChat()" class="w-full bg-blue-700 text-white p-6 rounded-[2rem] flex justify-between items-center">
                    <span>Chat with Live Agent</span>
                    <span>🗨️</span>
                </button>
                <button onclick="contactWhatsApp()" class="w-full border-2 border-slate-100 p-6 rounded-[2rem] flex justify-between items-center">
                    <span>Order via WhatsApp</span>
                    <span>📱</span>
                </button>
            </div>
            <button onclick="openSupportCenter()" class="w-full mt-6 text-slate-300 font-bold text-xs uppercase">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE",
            authDomain: "remoteworkingacess.firebaseapp.com",
            projectId: "remoteworkingacess",
            storageBucket: "remoteworkingacess.firebasestorage.app",
            messagingSenderId: "953179052891",
            appId: "1:953179052891:web:8126924e32e9fb62f4987e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let cart = [];

        onSnapshot(collection(db, "accounts"), (snapshot) => {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = "";
            snapshot.forEach((doc) => {
                const item = doc.data();
                const name = item.name.toLowerCase();
                
                // --- INTELLIGENT TASK & ICON ASSIGNMENT ---
                let icon = "🌐"; 
                let t1 = "• Global Micro-tasks";
                let t2 = "• Verified Login Access";

                if(name.includes('outlier')) {
                    icon = "🧠"; t1 = "• AI Training & Prompting"; t2 = "• RLHF Reasoning Tasks";
                } else if(name.includes('crowdgen') || name.includes('appen')) {
                    icon = "📊"; t1 = "• Image & Video Annotation"; t2 = "• Search Query Evaluation";
                } else if(name.includes('data annotation')) {
                    icon = "✍️"; t1 = "• Chatbot Fact-Checking"; t2 = "• Creative Writing Feedback";
                } else if(name.includes('transcription')) {
                    icon = "🎧"; t1 = "• Audio-to-Text Conversion"; t2 = "• Dialect Verifiction";
                } else if(name.includes('mercor')) {
                    icon = "💼"; t1 = "• Tech & Engineering Roles"; t2 = "• Portfolio Vetting Tasks";
                } else if(name.includes('rws')) {
                    icon = "🌍"; t1 = "• Translation Memory Tasks"; t2 = "• Linguistic Data Sourcing";
                } else if(name.includes('texting factory')) {
                    icon = "💬"; t1 = "• Anonymous Chat Moderation"; t2 = "• Text-Based Interaction";
                } else if(name.includes('respondent') || name.includes('prolific')) {
                    icon = "🧪"; t1 = "• Paid Research Studies"; t2 = "• Behavioral User Testing";
                } else if(name.includes('handshake')) {
                    icon = "🤝"; t1 = "• Entry-Level Career Tasks"; t2 = "• Student Work Assignments";
                } else if(name.includes('toloka')) {
                    icon = "📱"; t1 = "• Mobile Field Research"; t2 = "• Content Relevance Tasks";
                }

                grid.innerHTML += `
                    <div class="glass-card rounded-[2.5rem] p-7 shadow-2xl transition-all duration-300 hover:scale-[1.02] border border-white/50">
                        <div class="bg-blue-50/50 rounded-3xl p-5 mb-6 text-center">
                            <span class="text-4xl block mb-2">${icon}</span>
                            <p class="text-[10px] font-black text-blue-600 uppercase tracking-widest">Premium Account Ready</p>
                        </div>
                        
                        <div class="mb-5 bg-yellow-400/10 border border-yellow-200 p-4 rounded-2xl">
                            <p class="text-[9px] font-black text-yellow-700 uppercase tracking-widest mb-2 italic underline">Key Responsibilities:</p>
                            <p class="text-[10px] font-bold text-slate-700">${t1}</p>
                            <p class="text-[10px] font-bold text-slate-700">${t2}</p>
                        </div>

                        <h4 class="text-xl font-black italic uppercase text-slate-800 tracking-tighter mb-1">${item.name}</h4>
                        <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest mb-6">${item.location} • FULLY VERIFIED</p>
                        
                        <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                            <span class="text-3xl font-black text-blue-700 tracking-tighter">$${item.price}</span>
                            <button onclick="addToCart('${item.name}', '${item.location}', ${item.price})" class="bg-blue-700 text-white px-6 py-3 rounded-xl font-black text-[9px] uppercase tracking-widest hover:bg-black shadow-lg shadow-blue-200">Add to Cart</button>
                        </div>
                    </div>
                `;
            });
        });

        window.addToCart = (n, l, p) => { cart.push({name:n, loc:l, price:p}); updateCartUI(); if(document.getElementById('cart-drawer').classList.contains('translate-x-full')) toggleCart(); };
        window.toggleCart = () => document.getElementById('cart-drawer').classList.toggle('translate-x-full');
        window.removeFromCart = (i) => { cart.splice(i, 1); updateCartUI(); };
        window.openSupportCenter = () => cart.length === 0 ? alert("Cart Empty!") : document.getElementById('support-modal').classList.toggle('hidden');

        window.updateCartUI = () => {
            const list = document.getElementById('cart-list');
            const totalEl = document.getElementById('cart-total');
            const discountBox = document.getElementById('discount-notice');
            document.getElementById('cart-count').innerText = cart.length;
            list.innerHTML = cart.map((item, idx) => `
                <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <div><p class="font-black text-xs uppercase">${item.name}</p><p class="text-[8px] font-bold text-slate-400 uppercase">${item.loc}</p></div>
                    <div class="flex items-center gap-3"><span class="font-bold text-blue-700">$${item.price}</span><button onclick="removeFromCart(${idx})" class="text-red-300">✕</button></div>
                </div>`).join('');
            let subtotal = cart.reduce((sum, item) => sum + parseFloat(item.price), 0);
            let final = cart.length >= 2 ? subtotal * 0.90 : subtotal;
            discountBox.innerHTML = cart.length >= 2 ? `<div class="bg-green-50 text-green-600 p-3 rounded-xl text-[9px] font-black text-center mb-4 border border-green-100 uppercase italic">✨ 10% BUNDLE DISCOUNT APPLIED</div>` : "";
            totalEl.innerText = `$${final.toFixed(2)}`;
        };

        window.openLiveChat = () => { if (typeof Tawk_API !== "undefined") { Tawk_API.maximize(); Tawk_API.sendMessage("I want to order: " + cart.map(i => i.name).join(', ') + ". My total is " + document.getElementById('cart-total').innerText); } document.getElementById('support-modal').classList.add('hidden'); };
        window.contactWhatsApp = () => { window.open(`https://wa.me/18608968455?text=${encodeURIComponent("I'm purchasing: " + cart.map(i => i.name).join(', ') + ". Total: " + document.getElementById('cart-total').innerText)}`, '_blank'); };
    </script>
</body>
</html>
