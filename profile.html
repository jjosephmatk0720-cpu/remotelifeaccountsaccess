<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Working Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">

    <nav class="bg-white shadow p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="font-bold text-blue-700">← Back to Store</a>
            <button onclick="logout()" class="text-sm text-red-500 font-bold">Logout</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-6">
        <div class="bg-white rounded-2xl shadow-sm p-8 mb-8 border border-gray-100">
            <div class="flex items-center gap-4">
                <div class="bg-blue-100 p-4 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black">Customer Profile</h1>
                    <p id="user-email" class="text-gray-500 font-medium italic">Loading...</p>
                </div>
            </div>
        </div>

        <h2 class="text-xl font-bold mb-4">My Purchase History</h2>
        <div id="order-list" class="space-y-4">
            <p class="text-gray-400 italic">No orders found. Once your WhatsApp purchase is verified, your accounts will appear here.</p>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE",
            authDomain: "remoteworkingacess.firebaseapp.com",
            projectId: "remoteworkingacess",
            storageBucket: "remoteworkingacess.firebasestorage.app",
            messagingSenderId: "953179052891",
            appId: "1:953179052891:web:8126924e32e9fb62f4987e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Check if user is logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-email').innerText = user.email;
                loadOrders(user.uid);
            } else {
                // Not logged in? Send to login page
                window.location.href = "login.html";
            }
        });

        // Load specific orders for this user
        async function loadOrders(uid) {
            const orderList = document.getElementById('order-list');
            const q = query(collection(db, "orders"), where("userId", "==", uid));
            const snap = await getDocs(q);

            if (!snap.empty) {
                orderList.innerHTML = "";
                snap.forEach(d => {
                    const order = d.data();
                    orderList.innerHTML += `
                        <div class="bg-white p-5 rounded-xl border border-blue-100 shadow-sm">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold text-blue-500 uppercase">Order Verified</span>
                                <span class="text-xs text-gray-400">${order.date || 'Recent'}</span>
                            </div>
                            <h3 class="font-bold text-gray-800">${order.itemName}</h3>
                            <div class="mt-3 p-3 bg-gray-50 rounded border border-dashed border-gray-300">
                                <p class="text-xs text-gray-500 mb-1 font-bold uppercase tracking-widest">Account Credentials:</p>
                                <p class="text-sm font-mono text-blue-700 select-all">${order.credentials || 'Processing via WhatsApp...'}</p>
                            </div>
                        </div>`;
                });
            }
        }

        window.logout = () => {
            signOut(auth).then(() => { window.location.href = "login.html"; });
        };
    </script>
</body>
</html>
