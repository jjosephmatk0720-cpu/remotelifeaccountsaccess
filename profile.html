<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Working Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hero-bg { 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=1920&q=80'); 
            background-size: cover; background-position: center; 
        }
        .blur-card { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); }
        body { opacity: 0; transition: opacity 0.5s; }
        .progress-glow { box-shadow: 0 0 15px rgba(37, 99, 235, 0.4); }
    </style>
</head>
<body id="main-body" class="hero-bg min-h-screen flex items-center justify-center p-6">

    <div class="blur-card w-full max-w-lg p-10 rounded-[2.5rem] shadow-2xl relative">
        <a href="shop.html" class="absolute top-8 left-8 text-[10px] font-black uppercase text-blue-700 tracking-widest hover:text-black transition">← Back to Shop</a>
        
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-blue-100 rounded-full mx-auto mb-4 flex items-center justify-center border-4 border-white shadow-sm">
                <span id="user-initial" class="text-3xl font-black text-blue-900 uppercase">?</span>
            </div>
            <h2 id="user-email" class="text-sm font-black text-gray-400 uppercase tracking-widest leading-none">Loading...</h2>
        </div>

        <div class="mb-6 p-6 bg-blue-50 rounded-3xl border border-blue-100">
            <div class="flex justify-between text-[10px] font-black uppercase mb-2">
                <span class="text-blue-900">Referral Goal: <span id="ref-count">0</span>/10</span>
                <span id="reward-status" class="text-blue-500 italic">Target for Free Tasks</span>
            </div>
            <div class="w-full bg-blue-200/50 h-3 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-blue-600 h-full transition-all duration-1000 progress-glow" style="width: 0%"></div>
            </div>
        </div>

        <div class="bg-gray-50 p-6 rounded-3xl border border-gray-100 mb-6">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <p class="text-[8px] font-black text-gray-400 uppercase leading-none">Current Balance</p>
                    <p id="calc-result" class="text-2xl font-black text-blue-900 tracking-tighter">$0.00</p>
                </div>
                <button id="withdraw-btn" onclick="requestWithdrawal()" disabled class="bg-gray-300 text-white px-6 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest cursor-not-allowed transition duration-300">Withdraw</button>
            </div>
            <p class="text-[8px] font-bold text-gray-400 uppercase italic">Input your referral count below to see your earnings:</p>
            <input type="number" id="calc-input" placeholder="Enter Recruit Count" class="w-full mt-2 p-3 bg-white rounded-xl border border-gray-200 text-xs font-black outline-none focus:ring-1 focus:ring-blue-500">
        </div>

        <div class="bg-black p-6 rounded-3xl text-white">
            <p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 text-center">Your Recruiter ID</p>
            <p id="ref-link" class="text-center font-black text-blue-400 tracking-tight mb-4 break-all text-[10px] px-2 italic">Generating...</p>
            <button onclick="copyRef()" class="w-full bg-white text-black py-3 rounded-xl font-black text-[10px] uppercase tracking-widest hover:bg-blue-400 hover:text-white transition">Copy Referral Link</button>
        </div>
        
        <button onclick="logout()" class="w-full mt-6 text-[9px] font-black text-red-500 uppercase tracking-[0.2em] opacity-40 hover:opacity-100 transition">Log Out</button>
    </div>

    <script type="text/javascript">
        var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
        (function(){
            var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
            s1.async=true; s1.src='https://embed.tawk.to/697549464a0f82197e621807/1jfp2cf6e';
            s1.charset='UTF-8'; s1.setAttribute('crossorigin','*');
            s0.parentNode.insertBefore(s1,s0);
        })();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE",
            authDomain: "remoteworkingacess.firebaseapp.com",
            projectId: "remoteworkingacess",
            storageBucket: "remoteworkingacess.firebasestorage.app",
            messagingSenderId: "953179052891",
            appId: "1:953179052891:web:8126924e32e9fb62f4987e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
            } else {
                document.getElementById('main-body').style.opacity = "1";
                document.getElementById('user-email').innerText = user.email;
                document.getElementById('user-initial').innerText = user.email[0];
                document.getElementById('ref-link').innerText = `${window.location.origin}/index.html?ref=${user.uid}`;
                updateRewards(user.uid);
            }
        });

        async function updateRewards(uid) {
            const q = query(collection(db, "users"), where("referredBy", "==", uid));
            const snap = await getDocs(q);
            const count = snap.size;
            
            document.getElementById('ref-count').innerText = count;
            const percent = Math.min((count / 10) * 100, 100);
            document.getElementById('progress-bar').style.width = percent + "%";

            if (count >= 10) {
                const status = document.getElementById('reward-status');
                status.innerText = "TASKS UNLOCKED!";
                status.className = "text-green-600 font-black animate-pulse";
            }
        }

        // CALCULATOR & BUTTON ACTIVATION
        document.getElementById('calc-input').addEventListener('input', (e) => {
            const val = e.target.value;
            const estimate = val * 5; 
            const resultEl = document.getElementById('calc-result');
            const btn = document.getElementById('withdraw-btn');

            resultEl.innerText = "$" + estimate.toFixed(2);

            if (estimate > 0) {
                btn.disabled = false;
                btn.classList.remove('bg-gray-300', 'cursor-not-allowed');
                btn.classList.add('bg-blue-700', 'hover:bg-black', 'shadow-lg');
            } else {
                btn.disabled = true;
                btn.classList.add('bg-gray-300', 'cursor-not-allowed');
                btn.classList.remove('bg-blue-700', 'hover:bg-black');
            }
        });

        // WITHDRAWAL REQUEST LOGIC
        window.requestWithdrawal = () => {
            const amount = document.getElementById('calc-result').innerText;
            const userEmail = auth.currentUser.email;
            const message = `💰 WITHDRAWAL REQUEST: User ${userEmail} is requesting a withdrawal of ${amount}. Please authorize!`;

            if (typeof Tawk_API !== "undefined") {
                Tawk_API.maximize();
                Tawk_API.sendMessage(message);
                alert("Withdrawal Request Sent! Admin will verify your referrals and contact you in the Live Chat.");
            } else {
                alert("Live chat is loading, please try again in a second.");
            }
        };

        window.copyRef = () => {
            navigator.clipboard.writeText(document.getElementById('ref-link').innerText);
            alert("Referral link copied!");
        };

        window.logout = () => signOut(auth).then(() => window.location.href = "index.html");
    </script>
</body>
</html>
