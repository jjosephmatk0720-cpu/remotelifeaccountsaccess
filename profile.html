<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Account | Working Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: #0f172a; 
            color: white; 
            opacity: 0; 
            transition: opacity 0.4s; 
            overflow-x: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        .responsive-card { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(20px);
            width: 100%;
            max-width: 500px;
        }
        .progress-glow { box-shadow: 0 0 15px rgba(37, 99, 235, 0.5); }
    </style>
</head>
<body id="main-body" class="p-4 min-h-screen">

    <div class="w-full max-w-[500px] flex justify-between items-center mb-6 pt-2">
        <a href="shop.html" class="text-[10px] font-black uppercase tracking-[0.2em] text-blue-400">← Market</a>
        <button onclick="logout()" class="text-[10px] font-black uppercase tracking-[0.2em] text-red-500">Exit</button>
    </div>

    <div class="text-center mb-8">
        <div class="w-20 h-20 bg-gradient-to-tr from-blue-600 to-indigo-900 rounded-full mx-auto mb-3 flex items-center justify-center border-4 border-slate-800 shadow-xl">
            <span id="user-initial" class="text-3xl font-black uppercase">?</span>
        </div>
        <h2 id="user-email" class="text-[11px] font-bold text-slate-400 truncate px-4">Loading...</h2>
    </div>

    <div class="responsive-card p-6 rounded-[2.5rem] mb-4">
        <div class="flex justify-between items-end mb-3">
            <div>
                <p class="text-[9px] font-black text-blue-400 uppercase tracking-widest">Recruit Goal</p>
                <p class="text-xl font-black"><span id="ref-count">0</span> <span class="text-slate-500 text-sm">/ 10</span></p>
            </div>
            <div id="reward-status" class="text-[9px] font-black uppercase bg-blue-500/10 text-blue-400 px-3 py-1 rounded-full border border-blue-500/20">
                In Progress
            </div>
        </div>
        <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-blue-600 h-full transition-all duration-1000 progress-glow" style="width: 0%"></div>
        </div>
    </div>

    <div class="responsive-card p-6 rounded-[2.5rem] mb-4">
        <div class="text-center mb-4">
            <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">Commission Balance</p>
            <h3 id="calc-result" class="text-4xl font-black tracking-tighter text-white">$0.00</h3>
        </div>

        <div id="lock-msg" class="bg-red-500/10 border border-red-500/20 rounded-2xl p-3 mb-4 text-center">
            <p class="text-[9px] font-black text-red-400 uppercase italic">⚠️ Withdrawal Locked: Need <span id="needed-count">10</span> recruits</p>
        </div>

        <div class="space-y-3">
            <input type="number" id="calc-input" placeholder="Referral Count" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-center font-black text-white outline-none">
            <button id="withdraw-btn" onclick="requestWithdrawal()" disabled class="w-full bg-slate-800 text-slate-500 py-4 rounded-2xl font-black text-[11px] uppercase tracking-widest transition">Request TRC20 Withdrawal</button>
        </div>
    </div>

    <div class="w-full max-w-[500px] bg-blue-600 p-6 rounded-[2.5rem]">
        <p class="text-[10px] font-black uppercase text-blue-100 mb-3 text-center tracking-widest">Invite Link</p>
        <div class="bg-blue-700/50 rounded-2xl p-3 mb-4">
            <p id="ref-link" class="text-center font-bold text-white text-[10px] break-all opacity-80 italic">Generating...</p>
        </div>
        <button onclick="copyRef()" class="w-full bg-white text-blue-600 py-3 rounded-2xl font-black text-[11px] uppercase tracking-widest active:scale-95 transition">Copy My Link</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE", authDomain: "remoteworkingacess.firebaseapp.com", projectId: "remoteworkingacess", storageBucket: "remoteworkingacess.firebasestorage.app", messagingSenderId: "953179052891", appId: "1:953179052891:web:8126924e32e9fb62f4987e" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let verifiedCount = 0;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { 
                window.location.href = "index.html"; 
            } else {
                document.getElementById('main-body').style.opacity = "1";
                document.getElementById('user-email').innerText = user.email;
                document.getElementById('user-initial').innerText = user.email[0];
                document.getElementById('ref-link').innerText = `${window.location.origin}/index.html?ref=${user.uid}`;
                fetchStats(user.uid);
            }
        });

        async function fetchStats(uid) {
            try {
                const q = query(collection(db, "users"), where("referredBy", "==", uid));
                const snap = await getDocs(q);
                verifiedCount = snap.size;
                
                document.getElementById('ref-count').innerText = verifiedCount;
                document.getElementById('progress-bar').style.width = Math.min((verifiedCount / 10) * 100, 100) + "%";
                
                if (verifiedCount >= 10) {
                    document.getElementById('reward-status').innerText = "UNLOCKED";
                    document.getElementById('reward-status').className = "text-[9px] font-black uppercase bg-green-500/10 text-green-400 px-3 py-1 rounded-full border border-green-500/20 animate-pulse";
                    document.getElementById('lock-msg').classList.add('hidden');
                } else {
                    document.getElementById('needed-count').innerText = 10 - verifiedCount;
                }
            } catch (e) { console.error("Error fetching stats:", e); }
        }

        document.getElementById('calc-input').addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById('calc-result').innerText = "$" + (val * 5).toFixed(2);
            
            const btn = document.getElementById('withdraw-btn');
            if(verifiedCount >= 10 && val > 0) {
                btn.disabled = false;
                btn.className = "w-full bg-white text-black py-4 rounded-2xl font-black text-[11px] uppercase tracking-widest shadow-xl";
            } else {
                btn.disabled = true;
                btn.className = "w-full bg-slate-800 text-slate-500 py-4 rounded-2xl font-black text-[11px] uppercase tracking-widest";
            }
        });

        window.requestWithdrawal = async () => {
            const wallet = prompt("PROVIDE YOUR CRYPTO TRC20 ADDRESS:");
            if (!wallet || wallet.length < 10) return alert("Valid Wallet Required");
            
            try {
                await addDoc(collection(db, "withdrawals"), {
                    email: auth.currentUser.email,
                    amount: document.getElementById('calc-result').innerText,
                    wallet: wallet,
                    status: "pending",
                    createdAt: serverTimestamp()
                });
                alert("SUCCESS: Your withdrawal is pending approval. Jubilee Fortunes Investments admin has been notified.");
            } catch (e) { alert("Error submitting request."); }
        };

        window.copyRef = () => { 
            navigator.clipboard.writeText(document.getElementById('ref-link').innerText); 
            alert("Link Copied!"); 
        };

        window.logout = () => signOut(auth).then(() => window.location.href = "index.html");
    </script>
</body>
</html>
