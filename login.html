<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Access | Working Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hero-bg {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), 
                        url('https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 1);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="hero-bg min-h-screen flex items-center justify-center p-6 text-gray-800 font-sans">

    <div class="glass-card w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden p-10 border border-white/20">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-blue-800 uppercase italic tracking-tighter">Working Remote</h1>
            <p id="form-title" class="text-gray-400 font-bold text-[10px] uppercase tracking-[0.2em] mt-2">Sign In to Your Account</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="text-[10px] font-black uppercase text-gray-400 ml-2">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" class="w-full bg-gray-50 p-4 rounded-2xl border border-gray-100 outline-none focus:border-blue-500 transition font-medium">
            </div>

            <div>
                <label class="text-[10px] font-black uppercase text-gray-400 ml-2">Password</label>
                <div class="relative">
                    <input type="password" id="pass" placeholder="••••••••" class="w-full bg-gray-50 p-4 rounded-2xl border border-gray-100 outline-none focus:border-blue-500 transition font-medium">
                    <button onclick="togglePassword()" class="absolute right-4 top-4 text-gray-400 hover:text-blue-600 transition">
                        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button id="main-btn" onclick="handleAuth()" class="w-full bg-blue-700 text-white py-4 rounded-2xl font-black text-xs hover:bg-black shadow-xl shadow-blue-100 transition-all uppercase italic tracking-widest">
                Login
            </button>

            <div id="forgot-pw-box" class="text-center">
                <button onclick="forgotPassword()" class="text-[10px] font-bold text-gray-400 hover:text-blue-600 uppercase tracking-widest transition">Forgot Password?</button>
            </div>

            <div class="h-px bg-gray-100 my-2"></div>

            <div class="text-center">
                <p id="toggle-text" class="text-xs text-gray-500 font-medium">Don't have an account?</p>
                <button id="toggle-btn" onclick="switchMode()" class="text-xs font-black text-blue-700 uppercase tracking-wider mt-1 hover:underline">Create Account</button>
            </div>
        </div>

        <p id="msg" class="mt-6 text-center text-[10px] font-bold uppercase tracking-tight"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            sendEmailVerification, 
            sendPasswordResetEmail,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBmZC9gaj68vd-tWHqgf9H0pYZBvVHhnPE",
            authDomain: "remoteworkingacess.firebaseapp.com",
            projectId: "remoteworkingacess",
            storageBucket: "remoteworkingacess.firebasestorage.app",
            messagingSenderId: "953179052891",
            appId: "1:953179052891:web:8126924e32e9fb62f4987e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isLoginMode = true;

        onAuthStateChanged(auth, (user) => {
            if (user && user.emailVerified) {
                window.location.href = "index.html"; 
            }
        });

        window.switchMode = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('form-title').innerText = isLoginMode ? "Sign In to Your Account" : "Join the Community";
            document.getElementById('main-btn').innerText = isLoginMode ? "Login" : "Create Account";
            document.getElementById('toggle-text').innerText = isLoginMode ? "Don't have an account?" : "Already have an account?";
            document.getElementById('toggle-btn').innerText = isLoginMode ? "Create Account" : "Login Now";
            document.getElementById('forgot-pw-box').style.display = isLoginMode ? "block" : "none";
            document.getElementById('msg').innerText = "";
        };

        window.togglePassword = () => {
            const passInput = document.getElementById('pass');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        };

        window.handleAuth = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const msg = document.getElementById('msg');

            if(!email || !pass) {
                msg.innerText = "Error: Please fill all fields";
                msg.className = "mt-6 text-center text-[10px] font-bold uppercase text-red-500";
                return;
            }

            msg.innerText = "Processing...";
            msg.className = "mt-6 text-center text-[10px] font-bold uppercase text-blue-500";

            try {
                if (isLoginMode) {
                    const userCredential = await signInWithEmailAndPassword(auth, email, pass);
                    if (!userCredential.user.emailVerified) {
                        msg.innerText = "Error: Please verify your email first!";
                        msg.className = "mt-6 text-center text-[10px] font-bold uppercase text-orange-500";
                        return;
                    }
                    window.location.href = "index.html";
                } else {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                    await sendEmailVerification(userCredential.user);
                    alert("Verification link sent! Check your inbox.");
                    switchMode();
                }
            } catch (error) {
                msg.innerText = "Error: " + error.message;
                msg.className = "mt-6 text-center text-[10px] font-bold uppercase text-red-500";
            }
        };

        window.forgotPassword = async () => {
            const email = document.getElementById('email').value;
            if(!email) return alert("Enter your email address first!");
            try {
                await sendPasswordResetEmail(auth, email);
                alert("Password reset link sent!");
            } catch (error) {
                alert(error.message);
            }
        };
    </script>
</body>
</html>
